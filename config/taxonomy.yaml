# taxonomy.yaml — Saudi government institution routing taxonomy
# Edit this file to add/remove institutions. Everything downstream
# (prompts, mock data, baseline labels, evaluation) reads from here.
version: 1
language: ar

# Returned when the model is below the confidence threshold or the document
# genuinely spans several bodies. Never appears as a training label.
fallback_id: manual_review

institutions:
  - id: interior_public_security
    name_ar: "الأمن العام – وزارة الداخلية"
    name_en: "Public Security – Ministry of Interior"
    description_ar: >-
      البلاغات الجنائية والمرورية، الحوادث، السرقات، المفقودات، الشكاوى الأمنية،
      طلبات التحريات، مخالفات الإقامة والجوازات، وأمن الطرق.
    keywords_ar:
      - بلاغ
      - سرقة
      - حادث مروري
      - مركز الشرطة
      - دورية
      - مفقودات
      - الجوازات
      - رخصة قيادة
      - مخالفة مرورية
    document_types_ar:
      - محضر بلاغ
      - تقرير حادث
      - طلب تحريات
    disambiguation_ar: >-
      يوجّه هنا ما دام في مرحلة الضبط والبلاغ. إذا انتقل إلى التحقيق الرسمي أو
      توجيه الاتهام فهو للنيابة العامة، وإذا صدر فيه حكم أو دعوى فهو لوزارة العدل.

  - id: public_prosecution
    name_ar: "النيابة العامة"
    name_en: "Public Prosecution"
    description_ar: >-
      التحقيق الجنائي، توجيه الاتهام، أوامر التوقيف والإفراج، الإحالة إلى المحكمة،
      التظلم من إجراءات التحقيق.
    keywords_ar:
      - التحقيق
      - المدعي العام
      - لائحة اتهام
      - أمر توقيف
      - إحالة
      - إفراج
      - محضر استجواب
    document_types_ar:
      - قرار اتهام
      - أمر توقيف
      - محضر تحقيق
    disambiguation_ar: >-
      يتميز عن الأمن العام بأن الإجراء تحقيقي لا ضبطي، وعن وزارة العدل بأنه سابق
      لمرحلة المحاكمة والحكم.

  - id: moj_courts
    name_ar: "وزارة العدل"
    name_en: "Ministry of Justice"
    description_ar: >-
      الدعاوى المدنية والتجارية والأحوال الشخصية، الأحكام، الصكوك العقارية،
      التنفيذ، التوثيق، الوكالات الشرعية، النفقة والحضانة.
    keywords_ar:
      - دعوى
      - صك
      - محكمة
      - حكم
      - تنفيذ
      - وكالة شرعية
      - نفقة
      - حضانة
      - كاتب عدل
    document_types_ar:
      - صحيفة دعوى
      - صك حكم
      - طلب تنفيذ
    disambiguation_ar: >-
      كل ما يخص المحاكم والتوثيق. نزاعات العمل والأجور تذهب للموارد البشرية أولاً،
      ولا تصل العدل إلا بعد استنفاد اللجان العمالية.

  - id: moh_health
    name_ar: "وزارة الصحة"
    name_en: "Ministry of Health"
    description_ar: >-
      المستشفيات والمراكز الصحية، التقارير الطبية، المواعيد والتحويلات، الأدوية،
      الأخطاء الطبية، التطعيمات، والتراخيص الصحية للمنشآت الطبية.
    keywords_ar:
      - مستشفى
      - تقرير طبي
      - مريض
      - عيادة
      - دواء
      - موعد
      - تحويل طبي
      - إجازة مرضية
      - تطعيم
    document_types_ar:
      - تقرير طبي
      - طلب تحويل
      - شكوى خطأ طبي
    disambiguation_ar: >-
      سلامة المباني والحرائق في المنشأة الصحية تذهب للدفاع المدني، وتراخيص
      البناء نفسها لوزارة البلديات.

  - id: civil_defense
    name_ar: "المديرية العامة للدفاع المدني"
    name_en: "General Directorate of Civil Defense"
    description_ar: >-
      الحرائق، الإنقاذ، تصاريح السلامة، خطط الإخلاء، مخالفات اشتراطات السلامة،
      الكوارث والأمطار والسيول.
    keywords_ar:
      - حريق
      - إخلاء
      - سلامة
      - إطفاء
      - إنقاذ
      - طفايات
      - إنذار
      - اشتراطات السلامة
    document_types_ar:
      - تقرير حريق
      - تصريح سلامة
      - مخالفة اشتراطات
    disambiguation_ar: >-
      يختص بالسلامة والوقاية والاستجابة للطوارئ، لا بالإصابات وعلاجها (وزارة الصحة)
      ولا بمخالفات البناء (وزارة البلديات).

  - id: moe_education
    name_ar: "وزارة التعليم"
    name_en: "Ministry of Education"
    description_ar: >-
      المدارس والجامعات، الطلاب والمعلمون، الشهادات ومعادلتها، النقل المدرسي،
      الاختبارات، والقبول والتسجيل.
    keywords_ar:
      - مدرسة
      - طالب
      - معلم
      - شهادة
      - معادلة
      - جامعة
      - اختبار
      - نقل مدرسي
      - منحة دراسية
    document_types_ar:
      - طلب معادلة شهادة
      - إشعار قبول
      - شكوى ولي أمر
    disambiguation_ar: >-
      عقود المعلمين ورواتبهم في القطاع الخاص قد تمس الموارد البشرية، لكن كل ما
      يتعلق بالعملية التعليمية والمناهج والشهادات يوجّه هنا.

  - id: hrsd_labor
    name_ar: "وزارة الموارد البشرية والتنمية الاجتماعية"
    name_en: "Ministry of Human Resources and Social Development"
    description_ar: >-
      عقود العمل، الأجور المتأخرة، نقل الكفالة، السعودة، الفصل التعسفي،
      الضمان الاجتماعي، دور الرعاية، وتراخيص الجمعيات الأهلية.
    keywords_ar:
      - عقد عمل
      - أجور
      - نقل خدمات
      - فصل تعسفي
      - الضمان الاجتماعي
      - سعودة
      - مكتب العمل
      - إجازة سنوية
    document_types_ar:
      - شكوى عمالية
      - طلب ضمان اجتماعي
      - طلب نقل خدمات
    disambiguation_ar: >-
      يتميز عن التأمينات الاجتماعية بأن الأخيرة تختص بالاشتراكات والمعاشات
      التقاعدية وإصابات العمل المسجلة، بينما هنا علاقة العامل بصاحب العمل.

  - id: gosi
    name_ar: "المؤسسة العامة للتأمينات الاجتماعية"
    name_en: "General Organization for Social Insurance (GOSI)"
    description_ar: >-
      اشتراكات التأمينات، المعاشات التقاعدية، إصابات العمل والعجز، تسجيل
      المشتركين، وشهادات مدة الاشتراك.
    keywords_ar:
      - التأمينات الاجتماعية
      - اشتراك
      - معاش
      - تقاعد
      - إصابة عمل
      - مدة الاشتراك
      - عجز
    document_types_ar:
      - طلب صرف معاش
      - شهادة مدة اشتراك
      - إشعار إصابة عمل
    disambiguation_ar: >-
      إذا كان الموضوع اشتراكات أو معاشاً أو إصابة عمل مسجلة فهو هنا؛ وإذا كان
      نزاعاً على الأجر أو العقد فهو للموارد البشرية.

  - id: zatca
    name_ar: "هيئة الزكاة والضريبة والجمارك"
    name_en: "Zakat, Tax and Customs Authority (ZATCA)"
    description_ar: >-
      ضريبة القيمة المضافة، الزكاة، الفوترة الإلكترونية، الإقرارات الضريبية،
      التخليص الجمركي، المنافذ، والغرامات الضريبية.
    keywords_ar:
      - ضريبة القيمة المضافة
      - زكاة
      - إقرار ضريبي
      - فاتورة إلكترونية
      - جمارك
      - بيان جمركي
      - منفذ
      - غرامة ضريبية
    document_types_ar:
      - إشعار ربط ضريبي
      - بيان جمركي
      - اعتراض على غرامة
    disambiguation_ar: >-
      السجل التجاري وممارسة النشاط لوزارة التجارة، أما الضرائب والزكاة والجمارك
      المفروضة على النشاط فهنا.

  - id: mci_commerce
    name_ar: "وزارة التجارة"
    name_en: "Ministry of Commerce"
    description_ar: >-
      السجل التجاري، الغش التجاري، حماية المستهلك، العلامات التجارية، الأسعار،
      الشركات وتصفيتها، والاحتيال التجاري.
    keywords_ar:
      - سجل تجاري
      - غش تجاري
      - حماية المستهلك
      - علامة تجارية
      - شركة
      - تصفية
      - إعلان مضلل
      - تسعيرة
    document_types_ar:
      - بلاغ غش تجاري
      - طلب تعديل سجل
      - شكوى مستهلك
    disambiguation_ar: >-
      شكوى المستهلك على سلعة أو خدمة تأتي هنا؛ أما الفاتورة الضريبية غير النظامية
      فتخص هيئة الزكاة والضريبة والجمارك.

  - id: momah_municipal
    name_ar: "وزارة الشؤون البلدية والقروية والإسكان"
    name_en: "Ministry of Municipal and Rural Affairs and Housing"
    description_ar: >-
      رخص البناء، الأمانات والبلديات، النظافة، الإشغال، المحلات والمطاعم،
      الطرق الداخلية، الإسكان، والتشوه البصري.
    keywords_ar:
      - رخصة بناء
      - أمانة
      - بلدية
      - نظافة
      - إشغال
      - مطعم
      - تشوه بصري
      - سكني
      - مخطط
    document_types_ar:
      - طلب رخصة بناء
      - بلاغ نظافة
      - مخالفة بلدية
    disambiguation_ar: >-
      اشتراطات السلامة من الحريق داخل المنشأة للدفاع المدني، ونظافة الغذاء
      وسلامته داخل المطاعم للبلدية، أما الغش في السلعة فلوزارة التجارة.

  - id: mot_transport
    name_ar: "وزارة النقل والخدمات اللوجستية"
    name_en: "Ministry of Transport and Logistic Services"
    description_ar: >-
      الطرق السريعة، النقل البري والشاحنات، تراخيص نقل الركاب، الموانئ والسكك،
      الطيران المدني والخدمات اللوجستية.
    keywords_ar:
      - طريق سريع
      - شاحنة
      - نقل بري
      - ترخيص نقل
      - ميناء
      - سكة حديد
      - حافلة
      - صيانة الطريق
    document_types_ar:
      - طلب ترخيص نقل
      - بلاغ عن طريق
      - شكوى ناقل
    disambiguation_ar: >-
      المخالفات المرورية والحوادث للأمن العام، والطرق الداخلية داخل المدن
      للبلديات؛ أما الطرق بين المدن وتراخيص النقل فهنا.

  - id: civil_affairs
    name_ar: "الأحوال المدنية"
    name_en: "Civil Affairs"
    description_ar: >-
      الهوية الوطنية، سجل الأسرة، شهادات الميلاد والوفاة، عقود الزواج والطلاق
      من حيث القيد، تغيير الاسم، والبيانات الشخصية.
    keywords_ar:
      - الهوية الوطنية
      - سجل الأسرة
      - شهادة ميلاد
      - شهادة وفاة
      - تغيير الاسم
      - قيد
      - بدل فاقد
    document_types_ar:
      - طلب إصدار هوية
      - طلب تسجيل مولود
      - طلب تصحيح بيانات
    disambiguation_ar: >-
      القيد والتوثيق السجلي هنا؛ أما النزاع على النسب أو الطلاق نفسه فهو دعوى
      لدى وزارة العدل.

  - id: mewa_environment
    name_ar: "وزارة البيئة والمياه والزراعة"
    name_en: "Ministry of Environment, Water and Agriculture"
    description_ar: >-
      المياه والصرف، التلوث البيئي، المزارع والثروة الحيوانية، المبيدات،
      الصيد، الأمن الغذائي، ومحطات التحلية.
    keywords_ar:
      - مياه
      - تلوث
      - مزرعة
      - ثروة حيوانية
      - مبيدات
      - صيد
      - تحلية
      - صرف صحي
      - رعي
    document_types_ar:
      - بلاغ تلوث
      - طلب رخصة مزرعة
      - شكوى انقطاع مياه
    disambiguation_ar: >-
      انقطاع المياه وجودتها هنا، أما تصريف مياه الأمطار في الشوارع وتنظيفها
      فللبلديات، وسلامة الغذاء المُصنّع لوزارة التجارة والبلدية.

# Pairs the classifier confuses most. Injected into the prompt as explicit
# tie-breakers, and used by `docrouter evaluate` to report targeted error rates.
confusion_pairs:
  - [interior_public_security, public_prosecution]
  - [public_prosecution, moj_courts]
  - [hrsd_labor, gosi]
  - [zatca, mci_commerce]
  - [momah_municipal, civil_defense]
  - [momah_municipal, mot_transport]
  - [civil_affairs, moj_courts]
  - [mewa_environment, momah_municipal]
