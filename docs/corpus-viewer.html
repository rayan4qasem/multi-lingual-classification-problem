 مأهول بأربع شقق.\n\nلا يوجد بالمستودع أي طفايات ظاهرة، والمخرج الوحيد مغلق بصناديق\nمكدسة حتى السقف، كما لوحظ تمديد كهربائي مؤقت ممتد من المبنى.\n\nنخشى وقوع كارثة، ونأمل الكشف على الموقع وإلزام صاحبه باستيفاء\nاشتراطات السلامة أو إخلاء الموقع.\n\nمقدم البلاغ: مشعل بن تركي الحربي"}, {"id": "cur-cd-002", "label": "civil_defense", "name": "المديرية العامة للدفاع المدني", "difficulty": "easy", "subject": "طلب كشف وإصدار شهادة سلامة", "pair": null, "text": "بصدد افتتاح فرع جديد لمنشأتنا في مدينة الخبر على مساحة 640 متراً\nمربعاً، وقد استكملنا تركيب شبكة الإنذار المبكر ورشاشات الإطفاء\nالتلقائي، وتوفير مخرجين للطوارئ مع لوحات إرشادية مضيئة، وذلك وفق\nالمخططات المعتمدة المرفقة.\n\nنطلب تحديد موعد للكشف الميداني وإصدار الشهادة اللازمة لاستكمال\nإجراءات التشغيل.\n\nالمنشأة: شركة نماء للتجزئة\nالسجل التجاري: 2051077431\nالمفوض: ياسر بن عبدالله الغامدي"}, {"id": "cur-cd-003", "label": "civil_defense", "name": "المديرية العامة للدفاع المدني", "difficulty": "medium", "subject": "محضر مباشرة بلاغ", "pair": null, "text": "باشر الفريق البلاغ الوارد الساعة 02:17 عن اشتعال في الدور الأرضي\nلمبنى سكني مكون من أربعة أدوار بحي العزيزية.\n\nعند الوصول كان الحريق محصوراً في غرفة الكهرباء وامتد الدخان إلى\nبئر السلم. تمت السيطرة خلال 21 دقيقة، وأُخلي 14 شخصاً عبر سلم\nالطوارئ دون إصابات تذكر، وسُلّم شخصان يعانيان من استنشاق دخان\nإلى الفرقة الإسعافية في الموقع.\n\nالمبدئي يرجح تماساً كهربائياً في لوحة التوزيع الرئيسية.\n\nقائد الفرقة: رقيب / فيصل بن حمود السبيعي"}, {"id": "cur-cd-004", "label": "civil_defense", "name": "المديرية العامة للدفاع المدني", "difficulty": "hard", "subject": "إيقاف أعمال في موقع إنشائي", "pair": null, "text": "بناءً على الكشف الميداني على المبنى تحت الإنشاء بحي الملقا، والذي\nيحمل رخصة بناء سارية صادرة من الجهة البلدية المختصة، تبين ما يلي:\n\n- عدم توفر أي وسيلة إطفاء في الموقع رغم وجود أعمال لحام مستمرة.\n- تخزين أسطوانات غاز بجوار مواد قابلة للاشتعال.\n- سكن عمال داخل الموقع في غرف مؤقتة بلا مخرج طوارئ.\n\nوحيث إن ما سبق يشكل خطراً داهماً، صدر التوجيه بإيقاف أعمال اللحام\nوإخلاء السكن المؤقت حتى استيفاء الاشتراطات. ولا تتضمن هذه المذكرة\nأي مساس بالرخصة ذاتها.\n\nالمفتش: نقيب / عبدالعزيز بن مانع الدوسري"}, {"id": "cur-cd-005", "label": "civil_defense", "name": "المديرية العامة للدفاع المدني", "difficulty": "hard", "subject": "بشأن جاهزية منشأة صحية", "pair": null, "text": "إلحاقاً للجولة التفتيشية على المجمع الطبي بحي النزهة، نفيد بأن\nالمنشأة تعمل بكامل طاقتها إلا أن خطة الإخلاء المعلقة غير محدثة منذ\nعامين، ولا تتضمن الدور الثالث المضاف حديثاً، كما أن بابين من أبواب\nالطوارئ مغلقان بسلاسل.\n\nالمطلوب تحديث الخطة، وتنفيذ فرضية إخلاء موثقة، وفك إغلاق المخارج\nخلال خمسة عشر يوماً.\n\nملحوظة: ما ورد أعلاه يخص جاهزية المبنى ووسائل الحماية فقط، ولا\nعلاقة له بالخدمات العلاجية المقدمة داخل المجمع.\n\nرئيس فريق التفتيش: ملازم / وليد بن سعود العنزي"}, {"id": "cur-bnd-005", "label": "gosi", "name": "المؤسسة العامة للتأمينات الاجتماعية", "difficulty": "hard", "subject": "بشأن إصابة عمل وتقدير العجز", "pair": "hrsd_labor|gosi", "text": "أصبت أثناء عملي لدى منشأة مقاولات بتاريخ 3 شعبان 1446هـ، وقد\nسجلت المنشأة الإصابة وانتهى العلاج بتقرير طبي نهائي يفيد ببقاء\nمحدودية دائمة في حركة الكتف.\n\nلا خلاف بيني وبين صاحب العمل على الأجر أو العقد أو نهاية الخدمة،\nوما زلت على رأس العمل لديه.\n\nطلبي منحصر في إحالتي إلى اللجنة الطبية لتقدير نسبة العجز المستديم\nوصرف التعويض المستحق عنه.\n\nمقدمه: فهد بن مرزوق السبيعي\nرقم المشترك: 3388120774"}, {"id": "cur-gosi-001", "label": "gosi", "name": "المؤسسة العامة للتأمينات الاجتماعية", "difficulty": "easy", "subject": "طلب صرف معاش تقاعدي", "pair": null, "text": "أفيدكم بأنني أكملت مدة الاشتراك النظامية البالغة ثلاثاً وعشرين سنة\nوأربعة أشهر، وبلغت السن المقررة بتاريخ 2 شعبان 1446هـ، وقد انتهت\nعلاقتي بآخر منشأة عملت لديها في نهاية الشهر ذاته.\n\nأتقدم بطلب صرف المعاش التقاعدي اعتباراً من التاريخ المذكور، مرفقاً\nبه بيان مدة الاشتراك، وصورة الهوية، وشهادة الآيبان.\n\nمقدم الطلب: ناصر بن سليمان الحربي\nرقم المشترك: 3399142077"}, {"id": "cur-gosi-002", "label": "gosi", "name": "المؤسسة العامة للتأمينات الاجتماعية", "difficulty": "easy", "subject": "اعتراض على بيان مدة الاشتراك", "pair": null, "text": "عند استخراج بيان مدة الاشتراك لاحظت عدم إدراج الفترة من 1/1439 إلى\n6/1441، رغم أنني كنت على رأس العمل خلالها لدى منشأة مسجلة، وأرفق\nصورة العقد وكشوف الرواتب البنكية عن تلك الفترة.\n\nيترتب على هذا النقص فارق في احتساب المدة يبلغ نحو سنتين ونصف، مما\nيؤثر مباشرة على استحقاقي مستقبلاً.\n\nأطلب تصحيح البيان وضم المدة المذكورة بعد التحقق منها.\n\nمقدمه: صالح بن عبدالمحسن العتيبي\nرقم المشترك: 3277081455"}, {"id": "cur-gosi-003", "label": "gosi", "name": "المؤسسة العامة للتأمينات الاجتماعية", "difficulty": "medium", "subject": "إشعار إصابة عمل وتقدير عجز", "pair": null, "text": "نفيدكم بتعرض المشترك الموضحة بياناته أدناه لإصابة أثناء العمل\nبتاريخ 9 رجب 1446هـ، نتج عنها بتر جزئي في إصبعين من اليد اليسرى\nإثر انحشارها في آلة قطع داخل المصنع.\n\nاستكمل العلاج وانتهت فترة العلاج بتاريخ 20 رمضان 1446هـ، ويرفق\nطيه التقرير الطبي النهائي، ومحضر الحادثة الداخلي، وبيان ساعات\nالعمل يوم الواقعة.\n\nيرجى إحالته للجنة الطبية لتقدير نسبة العجز المستديم وصرف ما يستحق.\n\nالمنشأة: مصنع الرواد للصناعات المعدنية\nرقم المشترك: 3410229866"}, {"id": "cur-gosi-004", "label": "gosi", "name": "المؤسسة العامة للتأمينات الاجتماعية", "difficulty": "hard", "subject": "بشأن اشتراكات لم تُسدد عن موظف", "pair": null, "text": "أفيدكم بأنني عملت لدى منشأة خاصة لمدة أربع سنوات، وكان يُخصم من\nراتبي شهرياً نصيبي من الاشتراكات بحسب ما هو مثبت في مسيرات الرواتب\nالمرفقة، إلا أنه تبين لي عند الاستعلام أن المنشأة لم تورد تلك\nالمبالغ ولم تسجلني إلا في السنة الأخيرة فقط.\n\nلا أطلب هنا الفصل في علاقتي بصاحب العمل ولا مستحقات نهاية الخدمة،\nفذلك محل إجراء آخر مستقل. طلبي منحصر في تسجيل المدة غير المسجلة\nومطالبة المنشأة بتوريد الاشتراكات المستحقة عنها.\n\nمقدمه: إبراهيم بن عوض الزهراني\nرقم الهوية: 1071193028"}, {"id": "cur-gosi-005", "label": "gosi", "name": "المؤسسة العامة للتأمينات الاجتماعية", "difficulty": "hard", "subject": "طلب صرف معاش لمستحقين", "pair": null, "text": "توفي والدي رحمه الله بتاريخ 12 شوال 1446هـ وكان مشتركاً وله معاش\nتقاعدي يُصرف شهرياً، ويعول والدتي وأخوين قاصرين وأختاً غير متزوجة.\n\nأرفق شهادة الوفاة، وصك حصر الورثة، وصور هويات المستحقين.\n\nنطلب تحويل المعاش إلى المستحقين وفق الأنصبة النظامية، وإفادتنا\nبما يلزم من مستندات إضافية إن وُجدت.\n\nمقدم الطلب: عبدالرحمن بن ناصر البقمي"}, {"id": "cur-bnd-006", "label": "hrsd_labor", "name": "وزارة الموارد البشرية والتنمية الاجتماعية", "difficulty": "hard", "subject": "خصم من الراتب باسم الاشتراكات", "pair": "hrsd_labor|gosi", "text": "يقوم صاحب العمل بخصم مبالغ شهرية من راتبي تفوق النسبة النظامية\nلحصة الموظف، ويدرجها في المسير تحت بند التأمينات، ورفض تزويدي\nبتفصيل الاحتساب رغم طلبي الكتابي المرفق.\n\nأوضح أن اعتراضي هنا على تصرف صاحب العمل في أجري وعلى امتناعه عن\nبيان الخصومات، وهو ما يتعلق بعلاقتي التعاقدية به.\n\nأطلب إلزامه برد الفروق المخصومة بغير وجه حق وتصحيح المسير.\n\nمقدمه: أنور بن سعيد الزهراني"}, {"id": "cur-hrsd-001", "label": "hrsd_labor", "name": "وزارة الموارد البشرية والتنمية الاجتماعية", "difficulty": "easy", "subject": "شكوى تأخر صرف الأجور", "pair": null, "text": "أعمل لدى المنشأة الموضحة أدناه منذ 4 صفر 1443هـ بموجب عقد عمل\nموثق، وقد تأخر صرف راتبي عن خمسة أشهر متتالية، آخر ما استلمته كان\nعن شهر رمضان الماضي.\n\nراجعت الإدارة مراراً وأُبلغت بوجود تعثر مالي دون تحديد موعد للصرف،\nكما توقف تحديث البيانات في نظام حماية الأجور منذ ذلك التاريخ.\n\nأطلب إلزام صاحب العمل بصرف مستحقاتي المتأخرة البالغة 46,500 ريال.\n\nمقدم الشكوى: عبدالله بن مبارك القحطاني\nالمنشأة: مؤسسة الديار الحديثة للتشغيل والصيانة"}, {"id": "cur-hrsd-002", "label": "hrsd_labor", "name": "وزارة الموارد البشرية والتنمية الاجتماعية", "difficulty": "easy", "subject": "طلب نقل خدمات", "pair": null, "text": "أتقدم بطلب نقل خدماتي إلى منشأة أخرى وافقت على استقدامي، وذلك\nللأسباب الآتية:\n\n- عدم التزام صاحب العمل الحالي ببنود العقد فيما يخص ساعات العمل،\n  حيث يتجاوز الدوام اثنتي عشرة ساعة يومياً دون بدل.\n- عدم منحي الإجازة السنوية منذ عامين رغم تقديم الطلبات المرفقة.\n\nأرفق صورة العقد، وصور طلبات الإجازة، وموافقة المنشأة الجديدة.\n\nمقدم الطلب: راجيش كومار\nرقم الإقامة: 2447811093"}, {"id": "cur-hrsd-003", "label": "hrsd_labor", "name": "وزارة الموارد البشرية والتنمية الاجتماعية", "difficulty": "medium", "subject": "اعتراض على إنهاء عقد", "pair": null, "text": "فوجئت بقرار إنهاء عقدي بعد خدمة استمرت ست سنوات وثلاثة أشهر، دون\nإشعار مسبق ودون بيان سبب نظامي، وقد سُلمت خطاب الإنهاء في نفس يوم\nإيقاف صلاحياتي.\n\nلم أتلق أي إنذار كتابي سابق، ولا يوجد في ملفي أي مخالفة، وآخر\nتقييم أداء لي كان بدرجة ممتاز.\n\nأطلب النظر في التعويض عن إنهاء العقد لسبب غير مشروع، وصرف مكافأة\nنهاية الخدمة ورصيد الإجازات.\n\nمقدمه: هيا بنت فهد الدوسري"}, {"id": "cur-hrsd-004", "label": "hrsd_labor", "name": "وزارة الموارد البشرية والتنمية الاجتماعية", "difficulty": "hard", "subject": "مطالبة بأجر فترة انقطاع بعد إصابة", "pair": null, "text": "أصبت أثناء تأدية عملي بتاريخ 17 رجب 1446هـ إثر سقوط من سقالة في\nموقع المشروع، ونُقلت للمستشفى وبقيت منوماً أحد عشر يوماً ثم أُجيزت\nمرضياً لمدة شهر.\n\nقامت المنشأة بتسجيل الإصابة لدى الجهة التأمينية وأنا لا أنازع في\nذلك ولا في تقدير أي عجز. مطالبتي هنا مقصورة على أن صاحب العمل\nامتنع عن صرف الفرق المستحق عليه نظاماً عن فترة الانقطاع، واحتسبها\nخصماً من رصيد إجازاتي السنوية.\n\nأطلب إلزامه بصرف الفرق ورد الإجازات المخصومة.\n\nمقدمه: محمد بن عوض الشهري"}, {"id": "cur-hrsd-005", "label": "hrsd_labor", "name": "وزارة الموارد البشرية والتنمية الاجتماعية", "difficulty": "hard", "subject": "طلب بشأن معاش الضمان الاجتماعي", "pair": null, "text": "أفيدكم بأنني أرملة وأعول ثلاثة أبناء، وكنت مستفيدة من معاش الضمان\nالاجتماعي حتى شهر جمادى الآخرة 1446هـ، حيث أُوقف الصرف دون إشعار.\n\nعند الاستفسار أُفدت بأن السبب وجود دخل مسجل باسمي، وهو في الحقيقة\nعائد لسجل تجاري قديم متوقف عن النشاط منذ ثلاث سنوات وأرفق ما يثبت\nإيقافه.\n\nأطلب إعادة دراسة الأهلية وصرف المستحق عن الأشهر الموقوفة.\n\nمقدمة الطلب: أمل بنت سالم الغامدي\nرقم الهوية: 1044920883"}, {"id": "cur-bnd-001", "label": "interior_public_security", "name": "الأمن العام – وزارة الداخلية", "difficulty": "hard", "subject": "بلاغ عن نصب واحتيال", "pair": "interior_public_security|public_prosecution", "text": "أفيدكم بأنني تعرضت لعملية احتيال حولت على إثرها مبلغ 38,000 ريال\nلحساب شخص عرض عليّ بضاعة عبر حساب في إحدى المنصات، ثم انقطع\nتواصله وأغلق الحساب.\n\nلدي صور المحادثات وإشعار التحويل البنكي واسم صاحب الحساب المستفيد.\n\nأرغب في تقديم بلاغ رسمي بالواقعة وضبط الشخص المذكور. علماً بأنه لم\nيسبق تقديم بلاغ في هذا الشأن، ولم تُفتح بشأنه أي قضية بعد.\n\nمقدم البلاغ: عبدالرحمن بن فهد العتيبي\nرقم الهوية: 1092208874"}, {"id": "cur-interior-001", "label": "interior_public_security", "name": "الأمن العام – وزارة الداخلية", "difficulty": "easy", "subject": "بلاغ عن فقدان مركبة", "pair": null, "text": "المكرم مدير المركز المحترم\nالسلام عليكم ورحمة الله وبركاته، وبعد:\n\nأفيدكم بأنني تركت مركبتي من نوع تويوتا هايلكس موديل 2019، لوحة رقم\nب ر د 4471، أمام محل تجاري بحي الروضة مساء يوم الثلاثاء الموافق\n12 رجب 1446هـ، ولما عدت بعد نحو ثلث ساعة لم أجدها في موقعها.\n\nسألت حراس المواقف المجاورة فأفاد أحدهم بأنه شاهد شخصين يقودانها\nباتجاه الطريق الدائري. الاستمارة ورخصة السير كانتا داخل المركبة.\n\nأرجو تسجيل البلاغ وتعميم أوصاف المركبة، وإفادتي بما يستجد.\n\nمقدمه: سعد بن ناصر الدوسري\nرقم الهوية: 1042779318\nالجوال: 0553120944"}, {"id": "cur-interior-002", "label": "interior_public_security", "name": "الأمن العام – وزارة الداخلية", "difficulty": "medium", "subject": "طلب صورة من تقرير حادث", "pair": null, "text": "إشارة إلى الواقعة التي باشرتها الدورية على طريق الملك فهد مقابل مخرج 14\nبتاريخ 3 شعبان 1446هـ، والتي اصطدمت فيها مركبتي بمركبة أخرى نتج عنها\nتلفيات في المقدمة دون إصابات.\n\nأحتاج صورة معتمدة من التقرير المحرر في الموقع لاستكمال إجراءات\nالمطالبة لدى شركة التأمين، وقد مضى على الواقعة أكثر من ثلاثة أسابيع\nدون أن أتمكن من استخراجها إلكترونياً لعدم ظهورها في المنصة.\n\nآمل التوجيه بتزويدي بها أو إفادتي بسبب عدم إدراجها.\n\nمقدم الطلب: عبدالمجيد بن فهد الحربي\nرقم الهوية: 1098443027"}, {"id": "cur-interior-003", "label": "interior_public_security", "name": "الأمن العام – وزارة الداخلية", "difficulty": "medium", "subject": "شكوى من تجمعات وتفحيط", "pair": null, "text": "نحن سكان القطاع الشمالي من حي النرجس نشكو من تجمع مركبات شبه يومي\nفي الأرض الفضاء الواقعة خلف الجامع، يبدأ بعد منتصف الليل ويستمر حتى\nقرب الفجر، يصاحبه استعراض بالمركبات وأصوات مرتفعة جداً.\n\nالأمر تكرر طوال الشهرين الماضيين، وقد أدى في إحدى المرات إلى ارتطام\nمركبة بسور أحد المنازل. لدينا أطفال وكبار سن، والوضع لم يعد محتملاً.\n\nنأمل تكثيف المرور على الموقع في تلك الأوقات واتخاذ ما يلزم.\n\nوكيل السكان: ماجد بن سليمان العتيبي\nالجوال: 0501773820"}, {"id": "cur-interior-004", "label": "interior_public_security", "name": "الأمن العام – وزارة الداخلية", "difficulty": "hard", "subject": "مخالفة أنظمة الإقامة في منشأة", "pair": null, "text": "وردنا بلاغ عن وجود عمالة تعمل في ورشة بالمنطقة الصناعية الثانية على\nخلاف ما دُوّن في تأشيراتها، وبالانتقال للموقع تبين وجود سبعة أشخاص\nلا يحملون وثائق نظامية سارية، وقد جرى ضبطهم وأخذ إفاداتهم الأولية.\n\nنظراً لأن الواقعة تتعلق بأنظمة الإقامة والعمل غير النظامي، تم إيقاف\nالمضبوطين وإكمال إجراءات الضبط تمهيداً لاستكمال ما يلزم.\n\nيرفق: محضر الضبط، وكشف بأسماء المضبوطين وأرقام إقاماتهم.\n\nمحرر المحضر: رقيب أول / تركي بن عايض الشهري"}, {"id": "cur-interior-005", "label": "interior_public_security", "name": "الأمن العام – وزارة الداخلية", "difficulty": "hard", "subject": "بلاغ عن اعتداء", "pair": null, "text": "أتقدم ببلاغي هذا عن واقعة اعتداء تعرضت لها مساء أمس أمام مدخل مجمع\nتجاري بحي العزيزية، حيث قام شخص أعرفه بالاسم بالتعدي عليّ بالضرب\nإثر خلاف سابق على موقف سيارة، ونتج عن ذلك كدمات في الوجه واليد.\n\nتوجهت للمستشفى وحصلت على تقرير أولي مرفق بهذا الطلب، وأرغب في\nتسجيل الواقعة رسمياً وضبط الشخص المذكور وأخذ أقواله.\n\nأفيدكم بأنه لم يسبق تقديم أي بلاغ في هذه الواقعة، ولم يُباشر فيها\nأي إجراء حتى تاريخه.\n\nمقدمه: نايف بن مرزوق القحطاني\nرقم الهوية: 1076220514"}, {"id": "cur-bnd-008", "label": "mci_commerce", "name": "وزارة التجارة", "difficulty": "hard", "subject": "أسعار معلنة تخالف المحصل عند الدفع", "pair": "zatca|mci_commerce", "text": "يعرض أحد المتاجر أسعاراً على الرفوف تختلف عما يُحصل فعلياً عند\nنقطة البيع، وعند الاعتراض يُقال إن الفرق يعود إلى الضريبة، رغم أن\nاللوحات المعلقة تنص صراحة على أن الأسعار شاملة للضريبة.\n\nتكرر ذلك معي ثلاث مرات وبفروق تراوحت بين 6 و11 بالمائة، وأرفق صور\nالرفوف والفواتير.\n\nشكواي على مخالفة إعلان السعر وعدم مطابقة المعلن للمحصل، لا على\nاحتساب الضريبة في ذاته.\n\nمقدم الشكوى: نايف بن سلطان الدوسري"}, {"id": "cur-mci-001", "label": "mci_commerce", "name": "وزارة التجارة", "difficulty": "easy", "subject": "بلاغ عن منتج مقلد", "pair": null, "text": "اشتريت جهازاً إلكترونياً من محل بحي العليا بمبلغ 4,300 ريال على أنه\nأصلي وبضمان الوكيل، وعند مراجعة مركز الصيانة المعتمد أُفدت بأن\nالرقم التسلسلي غير مسجل لدى الوكيل وأن الجهاز مقلد.\n\nراجعت المحل فرفض الاسترجاع أو الاستبدال بحجة مرور مدة على الشراء.\n\nأرفق الفاتورة وإفادة مركز الصيانة، وأطلب اتخاذ الإجراء النظامي\nبحق المحل.\n\nمقدم البلاغ: فيصل بن ماجد الشمري\nالجوال: 0507712093"}, {"id": "cur-mci-002", "label": "mci_commerce", "name": "وزارة التجارة", "difficulty": "easy", "subject": "طلب تعديل بيانات سجل تجاري", "pair": null, "text": "أرغب في تعديل النشاط المدون في السجل التجاري رقم 1010449271 بإضافة\nنشاط تجارة الجملة في المواد الغذائية، وحذف نشاط لم تعد المنشأة\nتزاوله، مع تحديث عنوان المقر الرئيسي إلى مدينة الدمام.\n\nأرفق صورة السجل الحالي، وعقد الإيجار الموثق للمقر الجديد، وقرار\nالشركاء بالتعديل.\n\nالمفوض بالتوقيع: منصور بن علي الغامدي"}, {"id": "cur-mci-003", "label": "mci_commerce", "name": "وزارة التجارة", "difficulty": "medium", "subject": "شكوى امتناع عن تنفيذ الضمان", "pair": null, "text": "تعطل جهاز التكييف المركزي الذي اشتريته بتاريخ 8 محرم 1446هـ خلال\nفترة الضمان الموضحة في الفاتورة المرفقة، وعند مطالبة التاجر\nبالإصلاح رفض بحجة سوء الاستخدام دون تقديم أي تقرير فني يثبت ذلك.\n\nطلبت منه كتابياً إحالة الجهاز إلى الوكيل للفحص فامتنع.\n\nأطلب إلزامه بتنفيذ التزامات الضمان أو استبدال الجهاز.\n\nمقدم الشكوى: عبدالعزيز بن راشد المطيري"}, {"id": "cur-mci-004", "label": "mci_commerce", "name": "وزارة التجارة", "difficulty": "hard", "subject": "بلاغ عن إعلانات مضللة لمنشأة", "pair": null, "text": "تروج منشأة عبر حساباتها لتخفيضات بنسبة تصل إلى 70%، وعند الشراء\nتبين أن السعر المعروض قبل التخفيض مضخم ولم يُبع به فعلياً في أي\nوقت، كما أن العروض المعلنة غير متوفرة في الفروع.\n\nكما لوحظ عرض منتجات على أنها من علامة تجارية معروفة دون أن تكون\nالمنشأة وكيلاً أو موزعاً معتمداً لها.\n\nشكواي تنصب على الممارسة التجارية والإعلان المضلل واستخدام العلامة،\nوأرفق لقطات من الإعلانات وفواتير الشراء.\n\nمقدم البلاغ: خالد بن سليمان القحطاني"}, {"id": "cur-mci-005", "label": "mci_commerce", "name": "وزارة التجارة", "difficulty": "hard", "subject": "نزاع بين شركاء وطلب تصفية", "pair": null, "text": "نحن شركاء في شركة ذات مسؤولية محدودة برأس مال قدره مليون ريال،\nوقد توقفت الشركة عن ممارسة نشاطها منذ أكثر من عام، ويرفض الشريك\nالمدير تسليم الدفاتر أو عقد الجمعية العامة رغم الإنذارات المرفقة.\n\nنطلب اتخاذ ما يلزم نظاماً بشأن مخالفة المدير لالتزاماته، والنظر في\nحل الشركة وتصفيتها وتعيين مصفٍ.\n\nمقدمو الطلب: شركاء يمثلون 62% من رأس المال\nالسجل التجاري: 4030771209"}, {"id": "cur-bnd-015", "label": "mewa_environment", "name": "وزارة البيئة والمياه والزراعة", "difficulty": "hard", "subject": "تلوث ناتج عن تصريف صناعي", "pair": "mewa_environment|momah_municipal", "text": "تقوم منشأة صناعية على أطراف الحي بتصريف سائل داكن في مجرى طبيعي\nيمر بجوار مزارع قائمة، وقد تغير لون التربة على ضفتيه وظهرت طبقة\nزيتية على سطح الماء الراكد.\n\nالمطلوب أخذ عينات وتحليلها وتقييم الأثر البيئي على المجرى والتربة\nوالمياه الجوفية القريبة، واتخاذ ما يلزم بحق المنشأة.\n\nلا يتعلق بلاغنا بنظافة الشوارع أو رفع المخلفات من الأرصفة.\n\nمقدم البلاغ: خالد بن مسفر العنزي"}, {"id": "cur-mewa-001", "label": "mewa_environment", "name": "وزارة البيئة والمياه والزراعة", "difficulty": "easy", "subject": "شكوى ضعف وانقطاع المياه", "pair": null, "text": "ينقطع التيار المائي عن الجزء الشرقي من حي النخيل بشكل شبه يومي\nلفترات تمتد من الظهر حتى ما بعد منتصف الليل، ويستمر هذا الوضع منذ\nأكثر من شهرين.\n\nاضطر معظم السكان إلى شراء الصهاريج على حسابهم الخاص بمعدل مرتين\nأسبوعياً، رغم انتظامهم في سداد الفواتير.\n\nنأمل معالجة ضعف الضخ في الحي وإفادتنا بالخطة الزمنية.\n\nوكيل السكان: عبدالمحسن بن سعد الغامدي\nرقم الحساب: 7741209388"}, {"id": "cur-mewa-002", "label": "mewa_environment", "name": "وزارة البيئة والمياه والزراعة", "difficulty": "easy", "subject": "بلاغ عن تلوث مجرى وادٍ", "pair": null, "text": "تقوم إحدى المنشآت الواقعة على أطراف المدينة بتصريف مخلفات سائلة\nداكنة اللون في مجرى الوادي المجاور، خصوصاً في ساعات المساء.\n\nنتج عن ذلك تغير واضح في لون المياه ورائحة نفاذة، ونفوق أعداد من\nالأسماك في البرك الراكدة، كما ترعى الإبل في المنطقة نفسها.\n\nنأمل الكشف الميداني وأخذ عينات واتخاذ ما يلزم.\n\nمقدم البلاغ: مسفر بن حمد القحطاني"}, {"id": "cur-mewa-003", "label": "mewa_environment", "name": "وزارة البيئة والمياه والزراعة", "difficulty": "medium", "subject": "طلب رخصة مزرعة وتصريح بئر", "pair": null, "text": "أملك أرضاً زراعية مساحتها 18 هكتاراً بمنطقة القصيم بموجب الصك\nالمرفق، وأرغب في استخراج رخصة لمزرعة إنتاج نباتي مكشوف وبيوت\nمحمية.\n\nكما أطلب تصريحاً لحفر بئر لأغراض الري وفق الاشتراطات، مع تركيب\nعداد قياس، وأرفق الدراسة الفنية الأولية والكروكي.\n\nمقدم الطلب: سعود بن إبراهيم العنزي"}, {"id": "cur-mewa-004", "label": "mewa_environment", "name": "وزارة البيئة والمياه والزراعة", "difficulty": "hard", "subject": "بشأن طفح شبكة الصرف الصحي", "pair": null, "text": "يعاني حي الفيحاء من طفح متكرر لمياه الصرف الصحي من غرف التفتيش في\nثلاثة شوارع، ويتكرر ذلك أسبوعياً منذ أربعة أشهر، وتنتشر المياه على\nمساحة واسعة قبل أن تُشفط بالصهاريج.\n\nوقد تبين أن الشبكة الرئيسية للحي غير كافية لاستيعاب التوسع العمراني\nالأخير، وهو ما يستدعي معالجة على مستوى الشبكة نفسها لا مجرد شفط\nمتكرر أو تنظيف للشوارع.\n\nنأمل تقييم الشبكة ومعالجة أصل المشكلة.\n\nوكيل السكان: خالد بن عوض الشهري"}, {"id": "cur-mewa-005", "label": "mewa_environment", "name": "وزارة البيئة والمياه والزراعة", "difficulty": "hard", "subject": "بلاغ عن مبيدات غير مصرح بها", "pair": null, "text": "لاحظنا قيام أحد المزارعين المجاورين برش مبيدات في أوقات الرياح\nالنشطة، وتصل رذاذها إلى مزرعتنا ومنازل العمال الملاصقة.\n\nوعند سؤاله أفاد بأنه يستخدم مركباً مستورداً عبر طرق غير رسمية،\nولم نجد على العبوات أي بيانات تسجيل باللغة العربية.\n\nنخشى أثر ذلك على المحاصيل المجاورة وعلى صحة العاملين والثروة\nالحيوانية في المنطقة.\n\nمقدم البلاغ: عبدالله بن صالح البقمي"}, {"id": "cur-moe-001", "label": "moe_education", "name": "وزارة التعليم", "difficulty": "easy", "subject": "طلب معادلة شهادة جامعية", "pair": null, "text": "حصلت على درجة البكالوريوس في هندسة الحاسب من جامعة خارج المملكة\nبتاريخ 19 ذو القعدة 1445هـ، وأرفق طيه الشهادة الأصلية وكشف الدرجات\nمصدقين من الملحقية الثقافية والجهات المختصة.\n\nأتقدم بطلب معادلة الشهادة لاستكمال إجراءات التوظيف لدى جهة تشترط\nوجود المعادلة قبل التعاقد.\n\nمقدم الطلب: طلال بن مشعل البقمي\nرقم الهوية: 1085530092\nالجوال: 0559023877"}, {"id": "cur-moe-002", "label": "moe_education", "name": "وزارة التعليم", "difficulty": "easy", "subject": "شكوى ولي أمر بشأن الحافلة", "pair": null, "text": "ابنتي طالبة في الصف الخامس بإحدى مدارس حي السلامة، وتتأخر الحافلة\nيومياً ما بين ثلاثين وخمسين دقيقة عن موعد الحضور، مما أدى إلى\nاحتساب غياب متكرر لها في الحصة الأولى.\n\nراجعت إدارة المدرسة أكثر من مرة، وأُفدت بأن المتعهد لم يلتزم بعدد\nالحافلات المتفق عليه.\n\nأرجو معالجة الوضع أو تمكيني من نقلها إلى مسار آخر.\n\nولي الأمر: عادل بن سعد الزهراني\nالجوال: 0544128806"}, {"id": "cur-moe-003", "label": "moe_education", "name": "وزارة التعليم", "difficulty": "medium", "subject": "طلب نقل طالب", "pair": null, "text": "نظراً لانتقال سكننا من مدينة بريدة إلى حي النرجس بالرياض اعتباراً\nمن مطلع الفصل الدراسي الثاني، أتقدم بطلب نقل ابني من مدرسته الحالية\nإلى أقرب مدرسة لمقر السكن الجديد.\n\nأرفق صورة عقد الإيجار الموثق، وصورة سجل الأسرة، وآخر شهادة درجات.\n\nوأفيد بأن الطالب لديه خطة دعم تعليمي فردية، وآمل مراعاة استمرارها\nفي المدرسة الجديدة.\n\nولي الأمر: يوسف بن إبراهيم العتيبي"}, {"id": "cur-moe-004", "label": "moe_education", "name": "وزارة التعليم", "difficulty": "hard", "subject": "بشأن سلامة مبنى مدرسي", "pair": null, "text": "نفيدكم بأن المبنى المستأجر الذي تشغله المدرسة بحي الشفا يعاني من\nتشققات ظاهرة في جدار الفناء الخلفي، وقد اتسعت خلال الفصل الحالي.\n\nوقد سبق أن أُبلغت الجهات المعنية بالسلامة وتمت معاينة الموقع من\nناحية الحماية المدنية، إلا أن ما نطلبه هنا هو النظر في مناسبة\nالمبنى لاستمرار العملية التعليمية، والنظر في نقل الطالبات إلى مبنى\nبديل، وهو ما يخرج عن اختصاص جهة السلامة.\n\nمديرة المدرسة: أ. سارة بنت عبدالله الشهري"}, {"id": "cur-moe-005", "label": "moe_education", "name": "وزارة التعليم", "difficulty": "hard", "subject": "اعتراض على نتيجة اختبار", "pair": null, "text": "تقدمت لاختبار نهاية الفصل لمقرر الرياضيات، وظهرت نتيجتي بدرجة لا\nتتفق مع أدائي في الاختبارات الفصلية والواجبات، وعند مراجعة المعلم\nأُفدت بأن ورقتي صُححت آلياً ولا يمكن إعادة النظر فيها.\n\nأطلب إعادة تصحيح ورقتي يدوياً ومراجعة رصد الدرجات، حيث إن النتيجة\nأثرت على معدلي العام ومسار قبولي الجامعي.\n\nالطالب: راكان بن نواف المطيري\nرقم السجل المدني: 1103882771"}, {"id": "cur-moh-001", "label": "moh_health", "name": "وزارة الصحة", "difficulty": "easy", "subject": "طلب تحويل لمستشفى تخصصي", "pair": null, "text": "المريض: خالد بن مسفر الشهري، هوية رقم 1029447731، العمر 58 عاماً\n\nيعاني المريض من قصور في وظائف الكلى مع ارتفاع مستمر في مستوى\nالكرياتينين رغم الخطة العلاجية المتبعة منذ ستة أشهر، وقد أُجريت له\nالتحاليل والأشعة المرفقة بتاريخ 14 رجب 1446هـ.\n\nوحيث إن الحالة تستدعي متابعة تخصصية في وحدة أمراض الكلى غير المتوفرة\nلدينا، يوصى بتحويله إلى المستشفى التخصصي بالمنطقة لاستكمال التقييم\nوالنظر في خطة الغسيل.\n\nالطبيب المعالج: د. عمر بن راشد الزهراني\nالقسم: الباطنة"}, {"id": "cur-moh-002", "label": "moh_health", "name": "وزارة الصحة", "difficulty": "easy", "subject": "شكوى تأجيل موعد", "pair": null, "text": "حجزت موعداً في عيادة العظام منذ 11 صفر 1446هـ، وتم تأجيله ثلاث مرات\nمتتالية، آخرها إلى ما بعد أربعة أشهر من الآن دون إبداء سبب.\n\nحالتي تستدعي متابعة دورية بعد عملية تثبيت أُجريت لي، وقد نفد الدواء\nالموصوف ولا يُصرف إلا بمراجعة العيادة.\n\nأرجو النظر في تقديم الموعد أو تحويلي إلى أقرب مركز يمكنه المتابعة.\n\nمقدمه: نورة بنت صالح المطيري\nرقم الملف: 3318842"}, {"id": "cur-moh-003", "label": "moh_health", "name": "وزارة الصحة", "difficulty": "medium", "subject": "شكوى بشأن خطأ في صرف دواء", "pair": null, "text": "راجعت الصيدلية بوصفة صادرة من العيادة بتاريخ 6 شعبان 1446هـ، وصُرف\nلي دواء يختلف في التركيز عما هو مدون في الوصفة، ولم ألحظ ذلك إلا بعد\nاستخدامه ثلاثة أيام وظهور أعراض دوار وهبوط.\n\nراجعت الطوارئ وتم إيقاف الدواء وتعديل الجرعة، وأرفق صورة الوصفة\nوصورة العبوة المصروفة وتقرير الطوارئ.\n\nأرجو التحقق في الواقعة واتخاذ ما يلزم لمنع تكرارها.\n\nمقدمه: عبدالإله بن ناصر القحطاني"}, {"id": "cur-moh-004", "label": "moh_health", "name": "وزارة الصحة", "difficulty": "hard", "subject": "طلب تقرير طبي لغرض نظامي", "pair": null, "text": "أطلب تزويدي بتقرير طبي مفصل ومعتمد يوضح تاريخ الإصابة التي دخلت\nعلى إثرها المستشفى بتاريخ 28 جمادى الأولى 1446هـ، ومدة التنويم،\nونوع الإصابات، والآثار المتبقية إن وجدت.\n\nالتقرير مطلوب لتقديمه إلى جهة أخرى لاستكمال معاملة تخصني، وقد\nأُفدت بأنه لا بد أن يكون صادراً ومعتمداً من الجهة الصحية المعالجة.\n\nطلبي منحصر في إصدار التقرير ذاته دون أي مطالبة أخرى.\n\nمقدمه: سلطان بن فيصل العتيبي\nرقم الملف: 2299104"}, {"id": "cur-moh-005", "label": "moh_health", "name": "وزارة الصحة", "difficulty": "hard", "subject": "بلاغ عن منشأة صحية خاصة", "pair": null, "text": "أفيدكم بوجود مجمع طبي بحي السلامة يزاول تخصصات لم يُذكر أنها ضمن\nالترخيص المعلن في مدخله، كما أن أحد العاملين فيه يقدم خدمات علاجية\nدون أن يكون لديه تصنيف مهني ساري بحسب ما تبين لي عند الاستفسار.\n\nراجعت المجمع للاستيضاح فلم أتلق رداً واضحاً. وأرى أن الأمر يمس\nسلامة المرضى ويستدعي التحقق من التراخيص والتصنيف المهني للممارسين.\n\nمقدم البلاغ: أحمد بن عبدالرحمن الشمري\nالجوال: 0538814470"}, {"id": "cur-bnd-004", "label": "moj_courts", "name": "وزارة العدل", "difficulty": "hard", "subject": "مطالبة بالحق الخاص عن واقعة جنائية", "pair": "public_prosecution|moj_courts", "text": "أفيدكم بأنه صدر حكم في القضية الجزائية رقم 46/0771 بإدانة الجاني\nعن واقعة الاعتداء التي تعرضت لها، واكتسب الحكم القطعية.\n\nوحيث إن الحكم اقتصر على الحق العام، فإنني أتقدم بدعواي هذه للمطالبة\nبالتعويض عن الأضرار الجسدية والنفسية وما تكبدته من تكاليف علاج\nبلغت 47,200 ريال، وأرفق التقارير والفواتير.\n\nطلبي منصب على الحق الخاص والفصل فيه، وقد انتهت مرحلة التحقيق\nوالاتهام في هذه الواقعة.\n\nالمدعي: بندر بن عايض الغامدي"}, {"id": "cur-bnd-014", "label": "moj_courts", "name": "وزارة العدل", "difficulty": "hard", "subject": "دعوى تصحيح اسم لتعذر القيد", "pair": "civil_affairs|moj_courts", "text": "يختلف اسم جدي المدون في سجل الأسرة عما هو مثبت في وثائق التملك\nالقديمة العائدة له، مما عطل نقل ملكية عقار موروث.\n\nراجعت الجهة المختصة بالسجل فأُفدت بأن هذا الاختلاف لا يمكن تعديله\nإدارياً لعدم وجود مستند رسمي معاصر يثبت التطابق، وأنه يلزم صدور\nحكم بذلك.\n\nلذا أقيم هذه الدعوى لسماع الشهود والحكم بتصحيح الاسم، تمهيداً\nلاستكمال القيد بعد ذلك.\n\nالمدعي: حمد بن عبدالله العتيبي"}, {"id": "cur-moj-001", "label": "moj_courts", "name": "وزارة العدل", "difficulty": "easy", "subject": "صحيفة دعوى مطالبة مالية", "pair": null, "text": "المدعي: فهد بن عبدالله البقمي، سعودي الجنسية، هوية رقم 1033882910\nالمدعى عليه: مؤسسة الأفق للمقاولات، سجل تجاري رقم 4030229117\n\nالوقائع: تعاقدت مع المدعى عليها على تنفيذ أعمال ترميم في عقاري\nبحي الشفا بمبلغ 185,000 ريال، سُدد منه 120,000 ريال دفعة أولى\nبموجب الشيك المرفق. توقفت الأعمال عند نسبة إنجاز لا تتجاوز الثلث\nولم تُستأنف منذ 4 ربيع الآخر 1446هـ رغم المراسلات المرفقة.\n\nالطلبات: فسخ العقد، وإلزام المدعى عليها بإعادة مبلغ 78,000 ريال\nيمثل الفرق بين المدفوع والمنجز، مع التعويض عن الضرر."}, {"id": "cur-moj-002", "label": "moj_courts", "name": "وزارة العدل", "difficulty": "easy", "subject": "طلب فتح ملف تنفيذ", "pair": null, "text": "صدر لصالحي الحكم رقم 46/3318 من الدائرة المختصة، القاضي بإلزام\nالمحكوم عليه بتسليمي العقار الموضح حدوده وأطواله في الصك المرفق،\nوقد اكتسب الحكم الصفة القطعية بتاريخ 18 شعبان 1446هـ.\n\nوحيث إن المحكوم عليه لم ينفذ طوعاً رغم مضي المدة النظامية، أطلب\nفتح ملف تنفيذ واتخاذ الإجراءات النظامية بحقه.\n\nالمرفقات: صورة الصك، وصورة الحكم مع ما يفيد اكتسابه القطعية.\n\nمقدم الطلب: منيرة بنت سعد الشمري"}, {"id": "cur-moj-003", "label": "moj_courts", "name": "وزارة العدل", "difficulty": "medium", "subject": "دعوى حضانة وزيارة", "pair": null, "text": "بعد وقوع الفرقة بيني وبين المدعى عليه بموجب وثيقة الطلاق المرفقة،\nبقي الأولاد الثلاثة في حضانتي، إلا أنه امتنع منذ أربعة أشهر عن\nتمكيني من استخراج ما يلزمهم من إجراءات، كما أنه لا يلتزم بمواعيد\nالزيارة المتفق عليها ودياً.\n\nأطلب الحكم بإثبات الحضانة لي، وتنظيم الزيارة بمواعيد محددة، وفرض\nنفقة شهرية مناسبة تكفي حاجتهم من مسكن ودراسة وعلاج.\n\nالمدعية: ريم بنت محمد العنزي"}, {"id": "cur-moj-004", "label": "moj_courts", "name": "وزارة العدل", "difficulty": "hard", "subject": "تنفيذ حكم صادر في مطالبة عمالية", "pair": null, "text": "أفيدكم بأنه سبق أن قدمت شكوى ضد المنشأة التي كنت أعمل لديها، وأُحيلت\nإلى الدائرة المختصة التي أصدرت حكمها رقم 46/2861 بإلزام المنشأة\nبدفع مبلغ 96,400 ريال تمثل أجوراً متأخرة ومكافأة نهاية خدمة.\n\nاكتسب الحكم القطعية ولم تقم المنشأة بالسداد رغم مضي شهرين على\nإبلاغها. طلبي هنا مقصور على تنفيذ الحكم الصادر واتخاذ إجراءات\nالحجز اللازمة، وليس إعادة نظر في أصل المطالبة فقد فُصل فيها.\n\nمقدمه: عبدالله بن حمد الحربي\nرقم الهوية: 1067339820"}, {"id": "cur-moj-005", "label": "moj_courts", "name": "وزارة العدل", "difficulty": "hard", "subject": "دعوى إثبات نسب", "pair": null, "text": "أقيم هذه الدعوى لإثبات نسب ابني المولود بتاريخ 21 محرم 1445هـ،\nوذلك لوجود خلاف على توثيق عقد النكاح الذي تم في حينه بحضور شهود\nدون تسجيله في حينه لدى الجهة المختصة.\n\nوقد تعذر عليّ استكمال إجراءات القيد لعدم وجود ما يثبت العلاقة\nالزوجية رسمياً، وأُفدت بأن القيد لا يتم إلا بموجب حكم.\n\nأطلب سماع الشهود المرفقة أسماؤهم، والحكم بإثبات النسب تمهيداً\nلاستكمال ما يترتب عليه من إجراءات.\n\nالمدعية: لطيفة بنت عايض الغامدي"}, {"id": "cur-bnd-010", "label": "momah_municipal", "name": "وزارة الشؤون البلدية والقروية والإسكان", "difficulty": "hard", "subject": "مبنى آيل للسقوط في حي سكني", "pair": "momah_municipal|civil_defense", "text": "يوجد مبنى قديم مهجور منذ سنوات في حي المروج، تساقطت أجزاء من\nواجهته على الرصيف، ويدخله العابثون ليلاً، وقد شبّ فيه حريق صغير\nقبل شهرين أُطفئ في حينه.\n\nالمطلوب حصر وضع المبنى وإلزام مالكه بإزالته أو ترميمه وتسويره،\nوهو إجراء يتعلق بسلامة المباني ومخالفات البناء في النطاق البلدي.\n\nأما واقعة الحريق السابقة فقد بوشرت في حينها وانتهت، ولا نطلب\nإعادة النظر فيها.\n\nمقدم البلاغ: عبدالعزيز بن ماجد القحطاني"}, {"id": "cur-bnd-012", "label": "momah_municipal", "name": "وزارة الشؤون البلدية والقروية والإسكان", "difficulty": "hard", "subject": "مواقف ورصف شارع تجاري داخلي", "pair": "momah_municipal|mot_transport", "text": "الشارع التجاري في حي الورود يعاني من غياب تنظيم المواقف، حيث تصطف\nالمركبات في الاتجاهين وتضيق الممر إلى مسار واحد، كما أن الرصف\nمتهالك ومليء بالمطبات غير النظامية التي أنشأها أصحاب المحلات.\n\nالمطلوب إعادة رصف الشارع وتخطيط المواقف وإزالة المطبات غير\nالنظامية، وهو شارع داخلي ضمن نطاق الحي ولا يمثل جزءاً من شبكة\nالطرق الرابطة بين المدن.\n\nمقدم الطلب: وليد بن سالم الشهري"}, {"id": "cur-bnd-016", "label": "momah_municipal", "name": "وزارة الشؤون البلدية والقروية والإسكان", "difficulty": "hard", "subject": "تجمع مياه أمطار في شوارع الحي", "pair": "mewa_environment|momah_municipal", "text": "تتجمع مياه الأمطار في ثلاثة مواضع من شوارع حي الندى بعد كل هطول،\nوتبقى راكدة أياماً حتى تُشفط بالصهاريج، بسبب هبوط في مستوى الشارع\nوانسداد فتحات تصريف السطح.\n\nالمطلوب معالجة منسوب الشارع وتنظيف شبكة تصريف مياه الأمطار\nالسطحية وصيانة الفتحات، وهي أعمال تخص الشوارع داخل نطاق الحي.\n\nوأنوه إلى أن شبكة الصرف الصحي في الحي تعمل بصورة طبيعية ولا شكوى\nلدينا بشأنها ولا بشأن جودة مياه الشرب.\n\nمقدم البلاغ: سعد بن يوسف الحربي"}, {"id": "cur-momah-001", "label": "momah_municipal", "name": "وزارة الشؤون البلدية والقروية والإسكان", "difficulty": "easy", "subject": "طلب رخصة بناء", "pair": null, "text": "أملك قطعة أرض سكنية بحي الياسمين، رقم القطعة 447 من المخطط 2911،\nبموجب الصك المرفق، ومساحتها 600 متر مربع.\n\nأرغب في استخراج رخصة بناء لفيلا سكنية بدورين وملحق، وفق المخططات\nالمعتمدة من المكتب الهندسي المرفقة والتي روعيت فيها الارتدادات\nونسب البناء المقررة للمخطط.\n\nأرفق: صورة الصك، الكروكي، المخططات المعمارية والإنشائية، وشهادة\nالمكتب الهندسي.\n\nمقدم الطلب: عمر بن صالح الدوسري"}, {"id": "cur-momah-002", "label": "momah_municipal", "name": "وزارة الشؤون البلدية والقروية والإسكان", "difficulty": "easy", "subject": "بلاغ عن تراكم مخلفات", "pair": null, "text": "تتراكم مخلفات البناء ونفايات منزلية في الأرض الفضاء المقابلة\nلمنزلي بحي الخالدية منذ نحو ثلاثة أسابيع دون رفع، وقد انتشرت\nالروائح والقوارض وأصبحت مصدر إزعاج للسكان.\n\nكما يقوم بعض سائقي الشاحنات بإلقاء مخلفات إضافية ليلاً في الموقع\nذاته.\n\nنأمل التوجيه برفع المخلفات وتسوير الأرض وإلزام مالكها بنظافتها.\n\nمقدم البلاغ: سلمان بن فهد العنزي\nالجوال: 0561120884"}, {"id": "cur-momah-003", "label": "momah_municipal", "name": "وزارة الشؤون البلدية والقروية والإسكان", "difficulty": "medium", "subject": "شكوى إشغال رصيف وأرصفة", "pair": null, "text": "قام عدد من المحلات التجارية في شارع التخصصي بوضع بضائع ومظلات\nوطاولات تشغل الرصيف بالكامل على امتداد أكثر من مائة متر، مما\nيضطر المشاة والأطفال للسير في الشارع بين المركبات.\n\nكما أُغلق منحدر ذوي الإعاقة عند تقاطع الشارع بصناديق عرض.\n\nنأمل إزالة التعديات وإعادة الرصيف لوضعه النظامي.\n\nمقدم الشكوى: بدر بن عبدالله الحربي"}, {"id": "cur-momah-004", "label": "momah_municipal", "name": "وزارة الشؤون البلدية والقروية والإسكان", "difficulty": "hard", "subject": "بلاغ عن مطعم يصرف مخلفاته للشارع", "pair": null, "text": "يقوم مطعم بحي السلامة بتصريف مياه ومخلفات المطبخ عبر خرطوم ممتد\nإلى الشارع العام مباشرة، مما أدى إلى تجمعات مائية دائمة أمام\nالمحلات المجاورة وانبعاث روائح كريهة، خصوصاً في ساعات الذروة.\n\nكما أن مصيدة الشحوم الظاهرة خلف المحل ممتلئة وتفيض على الرصيف.\n\nطلبي هو مخالفة المحل وإلزامه بالتصريف النظامي وتصحيح وضع المصيدة،\nوهو ما يتعلق بنظافة الموقع واشتراطات المحل التجاري.\n\nمقدم البلاغ: أنس بن محمد الزهراني"}, {"id": "cur-momah-005", "label": "momah_municipal", "name": "وزارة الشؤون البلدية والقروية والإسكان", "difficulty": "hard", "subject": "بشأن حفريات وأضرار بالطريق الداخلي", "pair": null, "text": "نفيدكم بأن الشارع الداخلي المؤدي إلى مدرسة البنات بحي الروضة قد\nحُفر قبل نحو خمسة أشهر لتمديد خدمات، وأُعيد ردمه بشكل غير مستوٍ\nدون سفلتة، مما تسبب في هبوط في ثلاثة مواضع وتجمع مياه الأمطار فيها.\n\nوقد سقطت إحدى الطالبات في أحد المواضع الشهر الماضي.\n\nالمطلوب معالجة الهبوط وإعادة سفلتة الشارع وإلزام المتعهد المنفذ\nبإصلاح ما أحدثه، علماً بأن الشارع داخلي ضمن نطاق الحي ولا يتبع\nشبكة الطرق بين المدن.\n\nوكيل السكان: نواف بن تركي البقمي"}, {"id": "cur-bnd-011", "label": "mot_transport", "name": "وزارة النقل والخدمات اللوجستية", "difficulty": "hard", "subject": "تقاطع خطر على طريق خارجي", "pair": "momah_municipal|mot_transport", "text": "التقاطع الواقع عند الكيلو 34 على الطريق الرابط بين المدينتين يفتقر\nإلى مسار تباطؤ وإلى لوحات تحذيرية كافية، وقد وقعت فيه عدة حوادث\nخلال العام الحالي.\n\nالطريق خارجي يربط بين مدينتين ولا يقع ضمن النطاق العمراني لأي\nمنهما، والمطلوب دراسة التقاطع هندسياً وتنفيذ مسارات الدخول\nوالخروج واللوحات اللازمة.\n\nلا يتعلق طلبنا بالشوارع الداخلية للحي المجاور ولا بنظافتها.\n\nمقدم الطلب: مهندس / سامي بن عبدالله البقمي"}, {"id": "cur-mot-001", "label": "mot_transport", "name": "وزارة النقل والخدمات اللوجستية", "difficulty": "easy", "subject": "شكوى عن حالة طريق بين مدينتين", "pair": null, "text": "الطريق الرابط بين المحافظة ومركز الإمارة على امتداد نحو 70\nكيلومتراً يعاني من حفر عميقة على الكتف الأيمن، وطمس شبه كامل\nلخطوط التحديد، وغياب الإنارة على مقاطع طويلة منه.\n\nوقد شهد الطريق خلال الأشهر الستة الماضية عدداً من الحوادث، لا سيما\nعند المنحنى القريب من قرية الحفنة.\n\nنأمل إدراج الطريق ضمن خطط الصيانة العاجلة وتركيب العواكس والإنارة.\n\nمقدم الشكوى: عبدالله بن مسلم الشهري"}, {"id": "cur-mot-002", "label": "mot_transport", "name": "وزارة النقل والخدمات اللوجستية", "difficulty": "easy", "subject": "طلب ترخيص نشاط نقل بضائع", "pair": null, "text": "نرغب في الحصول على ترخيص لمزاولة نشاط نقل البضائع بالشاحنات على\nالطرق البرية داخل المملكة.\n\nبيانات المنشأة: سجل تجاري رقم 2050991174، ويبلغ عدد الشاحنات\nالمملوكة لنا اثنتي عشرة شاحنة مقطورة، جميعها موديلات بعد 2019،\nولدينا مستودع ومركز صيانة في المنطقة الصناعية.\n\nأرفق: السجل التجاري، بيان الأسطول، وعقود السائقين.\n\nالمفوض: مشعل بن ناصر العتيبي"}, {"id": "cur-mot-003", "label": "mot_transport", "name": "وزارة النقل والخدمات اللوجستية", "difficulty": "medium", "subject": "شكوى ضد شركة نقل ركاب", "pair": null, "text": "حجزت رحلة على حافلة من الرياض إلى القصيم بتاريخ 5 رجب 1446هـ\nالساعة العاشرة صباحاً، وتأخر الانطلاق أربع ساعات دون إشعار أو\nتفسير، ثم أُلغيت الرحلة نهائياً وطُلب منا الانتظار لليوم التالي.\n\nرفضت الشركة رد قيمة التذاكر أو تأمين بديل، ولم يتوفر أي منسق في\nالمحطة للرد على المسافرين.\n\nأطلب إلزام الشركة برد القيمة والنظر في التزامها بشروط الترخيص.\n\nمقدم الشكوى: يزيد بن سعود القحطاني"}, {"id": "cur-mot-004", "label": "mot_transport", "name": "وزارة النقل والخدمات اللوجستية", "difficulty": "hard", "subject": "بشأن شاحنات تسلك مساراً غير مخصص", "pair": null, "text": "نفيدكم بأن شاحنات نقل الحاويات المتجهة إلى المنطقة الصناعية تسلك\nالطريق الزراعي الفرعي بدلاً من المسار المخصص لها، وهو طريق غير\nمصمم لهذه الأحمال، مما أدى إلى تكسر الأكتاف وهبوط في الطبقة\nالأسفلتية على مسافة تقارب ثلاثة كيلومترات.\n\nالمطلوب النظر في تحديد المسارات الملزمة لهذه الأحمال ووضع اللوحات\nالإرشادية، وتقييم الطريق إنشائياً.\n\nوأنوه إلى أن طلبنا يخص المسار وتحمّل الطريق، لا مخالفات السائقين\nالفردية التي تُعالج في موضع آخر.\n\nرئيس المجلس البلدي الفرعي: سعود بن عبدالرحمن الغامدي"}, {"id": "cur-mot-005", "label": "mot_transport", "name": "وزارة النقل والخدمات اللوجستية", "difficulty": "hard", "subject": "شكوى بشأن تطبيق نقل توصيل", "pair": null, "text": "أعمل سائقاً عبر أحد تطبيقات نقل الركاب منذ عامين، وقد أوقف التطبيق\nحسابي فجأة بحجة مخالفة الشروط دون تحديد المخالفة، واحتجز رصيداً\nمستحقاً لي قدره 7,850 ريالاً.\n\nأوضح أنني لست موظفاً لدى التطبيق بل سائق مرخص أعمل عبر منصته،\nوشكواي تخص التزام المنصة بشروط ترخيص نشاط نقل الركاب وضوابط\nتعاملها مع السائقين المرخصين.\n\nمقدم الشكوى: أحمد بن عايض السبيعي\nرقم بطاقة التشغيل: 8841207"}, {"id": "cur-bnd-002", "label": "public_prosecution", "name": "النيابة العامة", "difficulty": "hard", "subject": "طلب بشأن مضبوطات في قضية", "pair": "interior_public_security|public_prosecution", "text": "سبق أن تقدمت ببلاغ عن سرقة محتويات مستودعي، وباشرت الجهة الأمنية\nالواقعة وضبطت شخصين وبحوزتهما جزء من المسروقات، وأُحيلت الأوراق\nوقُيدت القضية برقم 46/2044 وجرى استجواب المضبوطين.\n\nأطلب التوجيه بتسليمي الأعيان المضبوطة العائدة لي بعد انتهاء الحاجة\nإليها في التحقيق، وأرفق ما يثبت ملكيتي لها من فواتير.\n\nأوجه طلبي إلى الجهة التي تتولى التحقيق حالياً وبيدها التصرف في\nالمضبوطات، لا إلى الجهة التي باشرت الضبط ابتداءً.\n\nمقدمه: صالح بن مطلق الحربي"}, {"id": "cur-bnd-003", "label": "public_prosecution", "name": "النيابة العامة", "difficulty": "hard", "subject": "طلب سماع شاهد قبل الإحالة", "pair": "public_prosecution|moj_courts", "text": "بصفتي وكيلاً عن المشتكى عليه في القضية رقم 46/1902، أطلب سماع أقوال\nشاهد لم يُسمع حتى الآن، وهو الوحيد الذي كان حاضراً وقت الواقعة،\nوأرفق بياناته وما يفيد استعداده للحضور.\n\nوأوضح أن الأوراق لم تُحل بعد إلى المحكمة، وما زالت في مرحلة جمع\nالاستدلالات والتحقيق، ولذا فإن طلبي موجه إلى الجهة التي تباشر\nالتحقيق لا إلى جهة الفصل في الدعوى.\n\nالمحامي: عبدالإله بن ناصر الشمري\nرقم الترخيص: 4409921"}, {"id": "cur-prosecution-001", "label": "public_prosecution", "name": "النيابة العامة", "difficulty": "easy", "subject": "طلب الاطلاع على أوراق التحقيق", "pair": null, "text": "بصفتي وكيلاً شرعياً عن المتهم في القضية المقيدة برقم 46/1187، وبموجب\nالوكالة المرفقة الصادرة بتاريخ 9 جمادى الآخرة 1446هـ، أتقدم بطلب\nالتصريح لي بالاطلاع على أوراق التحقيق وتصوير ما يلزم منها.\n\nعلماً بأن موكلي قد جرى استجوابه بتاريخ 2 رجب 1446هـ، ولم يتمكن\nالدفاع حتى تاريخه من الاطلاع على محاضر السماع أو التقارير الفنية\nالمشار إليها في محضر الاستجواب.\n\nوذلك تمكيناً لحق الدفاع وفق ما تقضي به الأنظمة.\n\nالمحامي: د. صالح بن عبدالعزيز الزهراني\nرقم الترخيص: 4402118"}, {"id": "cur-prosecution-002", "label": "public_prosecution", "name": "النيابة العامة", "difficulty": "medium", "subject": "تظلم من استمرار التوقيف", "pair": null, "text": "أتقدم بالتظلم من استمرار توقيف موكلي في القضية رقم 46/0932، وذلك\nللأسباب الآتية:\n\nأولاً: مضى على التوقيف أكثر من أربعة أشهر دون استكمال الإجراءات.\nثانياً: موكلي له محل إقامة ثابت ومسجل، ويعمل لدى منشأة نظامية،\nوينتفي بذلك خطر الهروب.\nثالثاً: جميع الشهود قد سُمعت أقوالهم، وانتفى احتمال التأثير عليهم.\n\nلذا أطلب الإفراج عنه بضمان حضوري أو كفالة مالية مناسبة، مع التزامه\nبالحضور متى ما طُلب.\n\nالمحامي: هند بنت عبدالله السبيعي"}, {"id": "cur-prosecution-003", "label": "public_prosecution", "name": "النيابة العامة", "difficulty": "medium", "subject": "مذكرة بشأن استكمال التحقيق", "pair": null, "text": "إشارة إلى محضر الضبط الوارد من الجهة الأمنية بشأن الواقعة المقيدة\nبرقم 46/2205، أفيد بأنه تمت مباشرة الأوراق وسماع أقوال المبلغ\nوالمشتكى عليه وثلاثة من الشهود، كما ورد التقرير الفني المطلوب.\n\nوحيث إن ما تم جمعه من استدلالات يكفي لتوجيه الاتهام، فقد تقرر\nاستدعاء المشتكى عليه لاستجوابه بصفته متهماً، على أن تُستكمل الأوراق\nبعد ذلك تمهيداً للإحالة.\n\nيرفق: صورة من محضر السماع، والتقرير الفني.\n\nالمحقق المكلف: عبدالرحمن بن يوسف الغامدي"}, {"id": "cur-prosecution-004", "label": "public_prosecution", "name": "النيابة العامة", "difficulty": "hard", "subject": "طلب بشأن إجراء اتخذته الجهة الضابطة", "pair": null, "text": "أفيدكم بأن مركبتي قد جرى تحفظ عليها من قبل الجهة التي باشرت الواقعة\nباعتبارها متعلقة بالقضية رقم 46/1740، ومضى على ذلك ما يزيد على شهرين.\n\nوحيث إن الفحص الفني قد انتهى بحسب ما أُبلغت به، ولم تعد المركبة\nلازمة للتحقيق، فإنني أطلب التوجيه بالإفراج عنها وتسليمها لي.\n\nوأود التنويه إلى أن طلبي هذا موجه إلى الجهة التي تباشر التحقيق\nحالياً وبيدها التصرف في المضبوطات، لا إلى الجهة التي ضبطتها ابتداءً.\n\nمقدمه: بندر بن خالد المطيري\nرقم الهوية: 1055917204"}, {"id": "cur-prosecution-005", "label": "public_prosecution", "name": "النيابة العامة", "difficulty": "hard", "subject": "بلاغ عن تعدٍ على أموال عامة", "pair": null, "text": "نرفع إليكم ما تبين لنا من خلال المراجعة الداخلية من وجود صرف مالي\nغير مستند إلى أوامر نظامية بمبلغ إجمالي قدره 1,240,000 ريال خلال\nالفترة من 1445/07 إلى 1446/03، وذلك عن مشتريات لم يثبت توريدها.\n\nأُوقفت الصلاحيات المالية للموظفين ذوي العلاقة إدارياً، وتم حفظ\nالمستندات. وحيث إن ما ظهر يشكل شبهة جنائية تمس المال العام، نحيل\nالأوراق إليكم لما ترونه من إجراء تحقيقي.\n\nيرفق: تقرير المراجعة الداخلية، وكشف الصرف، وصور المستندات.\n\nمدير عام الشؤون المالية"}, {"id": "cur-bnd-007", "label": "zatca", "name": "هيئة الزكاة والضريبة والجمارك", "difficulty": "hard", "subject": "بشأن تحصيل ضريبة دون فاتورة نظامية", "pair": "zatca|mci_commerce", "text": "قمت بالشراء من محل تجاري وأضاف البائع نسبة 15% على السعر باعتبارها\nضريبة، إلا أنه سلمني سنداً يدوياً لا يحمل رقماً ضريبياً ولا يستوفي\nعناصر الفاتورة النظامية، ورفض إصدار فاتورة إلكترونية.\n\nلا شكوى لدي على السلعة نفسها ولا على جودتها ولا على المحل من حيث\nممارسته التجارية.\n\nبلاغي منصب على تحصيل مبلغ باسم الضريبة دون فاتورة نظامية، والتحقق\nمن إقرار المنشأة بما حصلته.\n\nمقدم البلاغ: تركي بن عبدالله المطيري"}, {"id": "cur-zatca-001", "label": "zatca", "name": "هيئة الزكاة والضريبة والجمارك", "difficulty": "easy", "subject": "اعتراض على ربط ضريبي", "pair": null, "text": "استلمت إشعار الربط رقم 46-VAT-118207 المتضمن فروقات في ضريبة القيمة\nالمضافة عن الفترة المنتهية في 30 ذو الحجة 1446هـ بمبلغ 214,300 ريال.\n\nلدينا مستندات تثبت أن جزءاً من المبيعات المحتسبة يمثل صادرات معفاة\nبموجب بيانات جمركية مرفقة، كما أن مشتريات بقيمة 87,000 ريال لم\nتُحتسب ضمن الضريبة المدخلة رغم توفر فواتيرها النظامية.\n\nنتقدم بالاعتراض خلال المدة النظامية، ونطلب إعادة احتساب الربط.\n\nالمنشأة: شركة المدى للتجارة\nالرقم الضريبي: 300442119800003"}, {"id": "cur-zatca-002", "label": "zatca", "name": "هيئة الزكاة والضريبة والجمارك", "difficulty": "easy", "subject": "استفسار عن ربط الفوترة الإلكترونية", "pair": null, "text": "منشأتنا مسجلة في ضريبة القيمة المضافة منذ عام 1441هـ، وإيراداتها\nالسنوية تقارب أربعة ملايين ريال.\n\nنستفسر عن المتطلبات الفنية لربط نظام الفوترة لدينا بالمنصة في مرحلة\nالتكامل، وعن الشريحة التي تندرج تحتها منشأتنا والموعد المحدد لها،\nوهل يلزم اعتماد مزود حلول معتمد أم يمكن التطوير الداخلي.\n\nالمنشأة: مؤسسة الضياء للتجهيزات\nالرقم الضريبي: 300771204500003"}, {"id": "cur-zatca-003", "label": "zatca", "name": "هيئة الزكاة والضريبة والجمارك", "difficulty": "medium", "subject": "طلب إنهاء إجراءات فسح إرسالية", "pair": null, "text": "لدينا إرسالية واردة عبر أحد المنافذ البحرية بموجب البيان رقم\n6633120945، تحتوي على قطع غيار صناعية، وقد استُكملت جميع المستندات\nالمطلوبة من شهادة منشأ وفاتورة وبوليصة شحن.\n\nمضى على وصول الإرسالية أحد عشر يوماً وما زالت موقوفة بانتظار\nالفحص، وتترتب علينا أرضيات يومية في الميناء.\n\nنأمل سرعة إنهاء الإجراءات أو إفادتنا بسبب التأخير.\n\nالمخلص الجمركي: تركي بن سعد العنزي\nرقم الترخيص: 55019"}, {"id": "cur-zatca-004", "label": "zatca", "name": "هيئة الزكاة والضريبة والجمارك", "difficulty": "hard", "subject": "بشأن امتناع منشأة عن إصدار فاتورة نظامية", "pair": null, "text": "قمت بشراء أجهزة من منشأة بمبلغ إجمالي 63,000 ريال شامل الضريبة،\nوعند طلب الفاتورة الضريبية سلمني البائع سند قبض يدوياً لا يحمل\nرقماً ضريبياً ولا يستوفي عناصر الفاتورة النظامية، ورفض إصدار غيره.\n\nأوضح أن شكواي هنا تخص عدم إصدار فاتورة ضريبية نظامية والتحقق من\nإقرار المنشأة بالضريبة المحصلة مني، لا جودة الأجهزة نفسها ولا\nعلاقتي التعاقدية بالبائع.\n\nمقدم البلاغ: وليد بن عبدالله السبيعي\nالرقم الضريبي للمنشأة كما ظهر في لوحتها: 300118776600003"}, {"id": "cur-zatca-005", "label": "zatca", "name": "هيئة الزكاة والضريبة والجمارك", "difficulty": "hard", "subject": "طلب إعادة نظر في تصنيف سلعة", "pair": null, "text": "وردت إرسالية باسم منشأتنا وصُنفت ضمن بند تعريفي يخضع لرسوم بنسبة\n15%، في حين أن السلعة عبارة عن مدخلات إنتاج تستخدم في التصنيع\nالمحلي وتخضع لبند آخر بنسبة 5% بحسب التصنيف المعتمد لدينا في\nإرساليات سابقة مماثلة أرفق بياناتها.\n\nنطلب إعادة النظر في التصنيف واسترداد الفرق المحصل والبالغ\n118,400 ريال.\n\nالمنشأة: مصنع الخليج للبلاستيك\nالرقم الضريبي: 301209884400003"}];

const DIFF = {hard:"صعبة", medium:"متوسطة", easy:"سهلة"};
const list = document.getElementById("list");
const q = document.getElementById("q");
const instSel = document.getElementById("inst");
const diffSel = document.getElementById("diff");
const bndSel = document.getElementById("bnd");
const count = document.getElementById("count");

const names = {};
DOCS.forEach(d => { names[d.label] = d.name; });
Object.entries(names)
  .sort((a, b) => a[1].localeCompare(b[1], "ar"))
  .forEach(([id, ar]) => {
    const n = DOCS.filter(d => d.label === id).length;
    instSel.insertAdjacentHTML("beforeend",
      '<option value="' + id + '">' + ar + " (" + n + ")</option>");
  });

function esc(s){
  return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function highlight(text, term){
  const safe = esc(text);
  if (!term) return safe;
  try {
    const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
    return safe.replace(re, m => "<mark>" + m + "</mark>");
  } catch (e) { return safe; }
}

function render(){
  const term = q.value.trim();
  const inst = instSel.value, diff = diffSel.value, bnd = bndSel.value;
  const shown = DOCS.filter(d =>
    (!inst || d.label === inst) &&
    (!diff || d.difficulty === diff) &&
    (!bnd || d.pair) &&
    (!term || d.text.includes(term) || d.subject.includes(term) || d.name.includes(term))
  );

  count.textContent = shown.length === DOCS.length
    ? "عرض كل الوثائق (" + DOCS.length + ")"
    : "عرض " + shown.length + " من " + DOCS.length;

  if (!shown.length){
    list.innerHTML = '<p class="empty">لا توجد وثائق مطابقة.</p>';
    return;
  }
  list.innerHTML = shown.map(d => {
    let pairLine = "";
    if (d.pair){
      const parts = d.pair.split("|");
      const other = d.label === parts[0] ? parts[1] : parts[0];
      pairLine = '<p class="pair">حالة حدودية: المختص <b>' + esc(d.name) +
                 "</b> وليس " + esc(names[other] || other) + "</p>";
    }
    return '<article class="' + d.difficulty + '">' +
      '<div class="top">' +
        '<span class="chip inst">' + esc(d.name) + "</span>" +
        '<span class="chip d-' + d.difficulty + '">' + DIFF[d.difficulty] + "</span>" +
        '<span class="docid">' + esc(d.id) + "</span>" +
      "</div>" +
      '<p class="subj">' + highlight(d.subject, term) + "</p>" +
      pairLine +
      "<pre>" + highlight(d.text, term) + "</pre>" +
    "</article>";
  }).join("");
}

[q, instSel, diffSel, bndSel].forEach(el => el.addEventListener("input", render));
render();
</script>
