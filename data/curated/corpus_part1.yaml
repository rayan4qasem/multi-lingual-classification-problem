# Curated Arabic corpus, part 1 of 3 — institutions 1-7.
# Authored to read like real correspondence, not like keyword bags.
# Rules followed while writing: the destination institution is named at most
# once and never in a way that gives the answer away; register varies between
# citizen letter, company letter, internal memo and official minute.
documents:

  # ---------- interior_public_security ----------
  - id: cur-interior-001
    label: interior_public_security
    difficulty: easy
    subject: بلاغ عن فقدان مركبة
    text: |
      المكرم مدير المركز المحترم
      السلام عليكم ورحمة الله وبركاته، وبعد:

      أفيدكم بأنني تركت مركبتي من نوع تويوتا هايلكس موديل 2019، لوحة رقم
      ب ر د 4471، أمام محل تجاري بحي الروضة مساء يوم الثلاثاء الموافق
      12 رجب 1446هـ، ولما عدت بعد نحو ثلث ساعة لم أجدها في موقعها.

      سألت حراس المواقف المجاورة فأفاد أحدهم بأنه شاهد شخصين يقودانها
      باتجاه الطريق الدائري. الاستمارة ورخصة السير كانتا داخل المركبة.

      أرجو تسجيل البلاغ وتعميم أوصاف المركبة، وإفادتي بما يستجد.

      مقدمه: سعد بن ناصر الدوسري
      رقم الهوية: 1042779318
      الجوال: 0553120944

  - id: cur-interior-002
    label: interior_public_security
    difficulty: medium
    subject: طلب صورة من تقرير حادث
    text: |
      إشارة إلى الواقعة التي باشرتها الدورية على طريق الملك فهد مقابل مخرج 14
      بتاريخ 3 شعبان 1446هـ، والتي اصطدمت فيها مركبتي بمركبة أخرى نتج عنها
      تلفيات في المقدمة دون إصابات.

      أحتاج صورة معتمدة من التقرير المحرر في الموقع لاستكمال إجراءات
      المطالبة لدى شركة التأمين، وقد مضى على الواقعة أكثر من ثلاثة أسابيع
      دون أن أتمكن من استخراجها إلكترونياً لعدم ظهورها في المنصة.

      آمل التوجيه بتزويدي بها أو إفادتي بسبب عدم إدراجها.

      مقدم الطلب: عبدالمجيد بن فهد الحربي
      رقم الهوية: 1098443027

  - id: cur-interior-003
    label: interior_public_security
    difficulty: medium
    subject: شكوى من تجمعات وتفحيط
    text: |
      نحن سكان القطاع الشمالي من حي النرجس نشكو من تجمع مركبات شبه يومي
      في الأرض الفضاء الواقعة خلف الجامع، يبدأ بعد منتصف الليل ويستمر حتى
      قرب الفجر، يصاحبه استعراض بالمركبات وأصوات مرتفعة جداً.

      الأمر تكرر طوال الشهرين الماضيين، وقد أدى في إحدى المرات إلى ارتطام
      مركبة بسور أحد المنازل. لدينا أطفال وكبار سن، والوضع لم يعد محتملاً.

      نأمل تكثيف المرور على الموقع في تلك الأوقات واتخاذ ما يلزم.

      وكيل السكان: ماجد بن سليمان العتيبي
      الجوال: 0501773820

  - id: cur-interior-004
    label: interior_public_security
    difficulty: hard
    subject: مخالفة أنظمة الإقامة في منشأة
    text: |
      وردنا بلاغ عن وجود عمالة تعمل في ورشة بالمنطقة الصناعية الثانية على
      خلاف ما دُوّن في تأشيراتها، وبالانتقال للموقع تبين وجود سبعة أشخاص
      لا يحملون وثائق نظامية سارية، وقد جرى ضبطهم وأخذ إفاداتهم الأولية.

      نظراً لأن الواقعة تتعلق بأنظمة الإقامة والعمل غير النظامي، تم إيقاف
      المضبوطين وإكمال إجراءات الضبط تمهيداً لاستكمال ما يلزم.

      يرفق: محضر الضبط، وكشف بأسماء المضبوطين وأرقام إقاماتهم.

      محرر المحضر: رقيب أول / تركي بن عايض الشهري

  - id: cur-interior-005
    label: interior_public_security
    difficulty: hard
    subject: بلاغ عن اعتداء
    text: |
      أتقدم ببلاغي هذا عن واقعة اعتداء تعرضت لها مساء أمس أمام مدخل مجمع
      تجاري بحي العزيزية، حيث قام شخص أعرفه بالاسم بالتعدي عليّ بالضرب
      إثر خلاف سابق على موقف سيارة، ونتج عن ذلك كدمات في الوجه واليد.

      توجهت للمستشفى وحصلت على تقرير أولي مرفق بهذا الطلب، وأرغب في
      تسجيل الواقعة رسمياً وضبط الشخص المذكور وأخذ أقواله.

      أفيدكم بأنه لم يسبق تقديم أي بلاغ في هذه الواقعة، ولم يُباشر فيها
      أي إجراء حتى تاريخه.

      مقدمه: نايف بن مرزوق القحطاني
      رقم الهوية: 1076220514

  # ---------- public_prosecution ----------
  - id: cur-prosecution-001
    label: public_prosecution
    difficulty: easy
    subject: طلب الاطلاع على أوراق التحقيق
    text: |
      بصفتي وكيلاً شرعياً عن المتهم في القضية المقيدة برقم 46/1187، وبموجب
      الوكالة المرفقة الصادرة بتاريخ 9 جمادى الآخرة 1446هـ، أتقدم بطلب
      التصريح لي بالاطلاع على أوراق التحقيق وتصوير ما يلزم منها.

      علماً بأن موكلي قد جرى استجوابه بتاريخ 2 رجب 1446هـ، ولم يتمكن
      الدفاع حتى تاريخه من الاطلاع على محاضر السماع أو التقارير الفنية
      المشار إليها في محضر الاستجواب.

      وذلك تمكيناً لحق الدفاع وفق ما تقضي به الأنظمة.

      المحامي: د. صالح بن عبدالعزيز الزهراني
      رقم الترخيص: 4402118

  - id: cur-prosecution-002
    label: public_prosecution
    difficulty: medium
    subject: تظلم من استمرار التوقيف
    text: |
      أتقدم بالتظلم من استمرار توقيف موكلي في القضية رقم 46/0932، وذلك
      للأسباب الآتية:

      أولاً: مضى على التوقيف أكثر من أربعة أشهر دون استكمال الإجراءات.
      ثانياً: موكلي له محل إقامة ثابت ومسجل، ويعمل لدى منشأة نظامية،
      وينتفي بذلك خطر الهروب.
      ثالثاً: جميع الشهود قد سُمعت أقوالهم، وانتفى احتمال التأثير عليهم.

      لذا أطلب الإفراج عنه بضمان حضوري أو كفالة مالية مناسبة، مع التزامه
      بالحضور متى ما طُلب.

      المحامي: هند بنت عبدالله السبيعي

  - id: cur-prosecution-003
    label: public_prosecution
    difficulty: medium
    subject: مذكرة بشأن استكمال التحقيق
    text: |
      إشارة إلى محضر الضبط الوارد من الجهة الأمنية بشأن الواقعة المقيدة
      برقم 46/2205، أفيد بأنه تمت مباشرة الأوراق وسماع أقوال المبلغ
      والمشتكى عليه وثلاثة من الشهود، كما ورد التقرير الفني المطلوب.

      وحيث إن ما تم جمعه من استدلالات يكفي لتوجيه الاتهام، فقد تقرر
      استدعاء المشتكى عليه لاستجوابه بصفته متهماً، على أن تُستكمل الأوراق
      بعد ذلك تمهيداً للإحالة.

      يرفق: صورة من محضر السماع، والتقرير الفني.

      المحقق المكلف: عبدالرحمن بن يوسف الغامدي

  - id: cur-prosecution-004
    label: public_prosecution
    difficulty: hard
    subject: طلب بشأن إجراء اتخذته الجهة الضابطة
    text: |
      أفيدكم بأن مركبتي قد جرى تحفظ عليها من قبل الجهة التي باشرت الواقعة
      باعتبارها متعلقة بالقضية رقم 46/1740، ومضى على ذلك ما يزيد على شهرين.

      وحيث إن الفحص الفني قد انتهى بحسب ما أُبلغت به، ولم تعد المركبة
      لازمة للتحقيق، فإنني أطلب التوجيه بالإفراج عنها وتسليمها لي.

      وأود التنويه إلى أن طلبي هذا موجه إلى الجهة التي تباشر التحقيق
      حالياً وبيدها التصرف في المضبوطات، لا إلى الجهة التي ضبطتها ابتداءً.

      مقدمه: بندر بن خالد المطيري
      رقم الهوية: 1055917204

  - id: cur-prosecution-005
    label: public_prosecution
    difficulty: hard
    subject: بلاغ عن تعدٍ على أموال عامة
    text: |
      نرفع إليكم ما تبين لنا من خلال المراجعة الداخلية من وجود صرف مالي
      غير مستند إلى أوامر نظامية بمبلغ إجمالي قدره 1,240,000 ريال خلال
      الفترة من 1445/07 إلى 1446/03، وذلك عن مشتريات لم يثبت توريدها.

      أُوقفت الصلاحيات المالية للموظفين ذوي العلاقة إدارياً، وتم حفظ
      المستندات. وحيث إن ما ظهر يشكل شبهة جنائية تمس المال العام، نحيل
      الأوراق إليكم لما ترونه من إجراء تحقيقي.

      يرفق: تقرير المراجعة الداخلية، وكشف الصرف، وصور المستندات.

      مدير عام الشؤون المالية

  # ---------- moj_courts ----------
  - id: cur-moj-001
    label: moj_courts
    difficulty: easy
    subject: صحيفة دعوى مطالبة مالية
    text: |
      المدعي: فهد بن عبدالله البقمي، سعودي الجنسية، هوية رقم 1033882910
      المدعى عليه: مؤسسة الأفق للمقاولات، سجل تجاري رقم 4030229117

      الوقائع: تعاقدت مع المدعى عليها على تنفيذ أعمال ترميم في عقاري
      بحي الشفا بمبلغ 185,000 ريال، سُدد منه 120,000 ريال دفعة أولى
      بموجب الشيك المرفق. توقفت الأعمال عند نسبة إنجاز لا تتجاوز الثلث
      ولم تُستأنف منذ 4 ربيع الآخر 1446هـ رغم المراسلات المرفقة.

      الطلبات: فسخ العقد، وإلزام المدعى عليها بإعادة مبلغ 78,000 ريال
      يمثل الفرق بين المدفوع والمنجز، مع التعويض عن الضرر.

  - id: cur-moj-002
    label: moj_courts
    difficulty: easy
    subject: طلب فتح ملف تنفيذ
    text: |
      صدر لصالحي الحكم رقم 46/3318 من الدائرة المختصة، القاضي بإلزام
      المحكوم عليه بتسليمي العقار الموضح حدوده وأطواله في الصك المرفق،
      وقد اكتسب الحكم الصفة القطعية بتاريخ 18 شعبان 1446هـ.

      وحيث إن المحكوم عليه لم ينفذ طوعاً رغم مضي المدة النظامية، أطلب
      فتح ملف تنفيذ واتخاذ الإجراءات النظامية بحقه.

      المرفقات: صورة الصك، وصورة الحكم مع ما يفيد اكتسابه القطعية.

      مقدم الطلب: منيرة بنت سعد الشمري

  - id: cur-moj-003
    label: moj_courts
    difficulty: medium
    subject: دعوى حضانة وزيارة
    text: |
      بعد وقوع الفرقة بيني وبين المدعى عليه بموجب وثيقة الطلاق المرفقة،
      بقي الأولاد الثلاثة في حضانتي، إلا أنه امتنع منذ أربعة أشهر عن
      تمكيني من استخراج ما يلزمهم من إجراءات، كما أنه لا يلتزم بمواعيد
      الزيارة المتفق عليها ودياً.

      أطلب الحكم بإثبات الحضانة لي، وتنظيم الزيارة بمواعيد محددة، وفرض
      نفقة شهرية مناسبة تكفي حاجتهم من مسكن ودراسة وعلاج.

      المدعية: ريم بنت محمد العنزي

  - id: cur-moj-004
    label: moj_courts
    difficulty: hard
    subject: تنفيذ حكم صادر في مطالبة عمالية
    text: |
      أفيدكم بأنه سبق أن قدمت شكوى ضد المنشأة التي كنت أعمل لديها، وأُحيلت
      إلى الدائرة المختصة التي أصدرت حكمها رقم 46/2861 بإلزام المنشأة
      بدفع مبلغ 96,400 ريال تمثل أجوراً متأخرة ومكافأة نهاية خدمة.

      اكتسب الحكم القطعية ولم تقم المنشأة بالسداد رغم مضي شهرين على
      إبلاغها. طلبي هنا مقصور على تنفيذ الحكم الصادر واتخاذ إجراءات
      الحجز اللازمة، وليس إعادة نظر في أصل المطالبة فقد فُصل فيها.

      مقدمه: عبدالله بن حمد الحربي
      رقم الهوية: 1067339820

  - id: cur-moj-005
    label: moj_courts
    difficulty: hard
    subject: دعوى إثبات نسب
    text: |
      أقيم هذه الدعوى لإثبات نسب ابني المولود بتاريخ 21 محرم 1445هـ،
      وذلك لوجود خلاف على توثيق عقد النكاح الذي تم في حينه بحضور شهود
      دون تسجيله في حينه لدى الجهة المختصة.

      وقد تعذر عليّ استكمال إجراءات القيد لعدم وجود ما يثبت العلاقة
      الزوجية رسمياً، وأُفدت بأن القيد لا يتم إلا بموجب حكم.

      أطلب سماع الشهود المرفقة أسماؤهم، والحكم بإثبات النسب تمهيداً
      لاستكمال ما يترتب عليه من إجراءات.

      المدعية: لطيفة بنت عايض الغامدي

  # ---------- moh_health ----------
  - id: cur-moh-001
    label: moh_health
    difficulty: easy
    subject: طلب تحويل لمستشفى تخصصي
    text: |
      المريض: خالد بن مسفر الشهري، هوية رقم 1029447731، العمر 58 عاماً

      يعاني المريض من قصور في وظائف الكلى مع ارتفاع مستمر في مستوى
      الكرياتينين رغم الخطة العلاجية المتبعة منذ ستة أشهر، وقد أُجريت له
      التحاليل والأشعة المرفقة بتاريخ 14 رجب 1446هـ.

      وحيث إن الحالة تستدعي متابعة تخصصية في وحدة أمراض الكلى غير المتوفرة
      لدينا، يوصى بتحويله إلى المستشفى التخصصي بالمنطقة لاستكمال التقييم
      والنظر في خطة الغسيل.

      الطبيب المعالج: د. عمر بن راشد الزهراني
      القسم: الباطنة

  - id: cur-moh-002
    label: moh_health
    difficulty: easy
    subject: شكوى تأجيل موعد
    text: |
      حجزت موعداً في عيادة العظام منذ 11 صفر 1446هـ، وتم تأجيله ثلاث مرات
      متتالية، آخرها إلى ما بعد أربعة أشهر من الآن دون إبداء سبب.

      حالتي تستدعي متابعة دورية بعد عملية تثبيت أُجريت لي، وقد نفد الدواء
      الموصوف ولا يُصرف إلا بمراجعة العيادة.

      أرجو النظر في تقديم الموعد أو تحويلي إلى أقرب مركز يمكنه المتابعة.

      مقدمه: نورة بنت صالح المطيري
      رقم الملف: 3318842

  - id: cur-moh-003
    label: moh_health
    difficulty: medium
    subject: شكوى بشأن خطأ في صرف دواء
    text: |
      راجعت الصيدلية بوصفة صادرة من العيادة بتاريخ 6 شعبان 1446هـ، وصُرف
      لي دواء يختلف في التركيز عما هو مدون في الوصفة، ولم ألحظ ذلك إلا بعد
      استخدامه ثلاثة أيام وظهور أعراض دوار وهبوط.

      راجعت الطوارئ وتم إيقاف الدواء وتعديل الجرعة، وأرفق صورة الوصفة
      وصورة العبوة المصروفة وتقرير الطوارئ.

      أرجو التحقق في الواقعة واتخاذ ما يلزم لمنع تكرارها.

      مقدمه: عبدالإله بن ناصر القحطاني

  - id: cur-moh-004
    label: moh_health
    difficulty: hard
    subject: طلب تقرير طبي لغرض نظامي
    text: |
      أطلب تزويدي بتقرير طبي مفصل ومعتمد يوضح تاريخ الإصابة التي دخلت
      على إثرها المستشفى بتاريخ 28 جمادى الأولى 1446هـ، ومدة التنويم،
      ونوع الإصابات، والآثار المتبقية إن وجدت.

      التقرير مطلوب لتقديمه إلى جهة أخرى لاستكمال معاملة تخصني، وقد
      أُفدت بأنه لا بد أن يكون صادراً ومعتمداً من الجهة الصحية المعالجة.

      طلبي منحصر في إصدار التقرير ذاته دون أي مطالبة أخرى.

      مقدمه: سلطان بن فيصل العتيبي
      رقم الملف: 2299104

  - id: cur-moh-005
    label: moh_health
    difficulty: hard
    subject: بلاغ عن منشأة صحية خاصة
    text: |
      أفيدكم بوجود مجمع طبي بحي السلامة يزاول تخصصات لم يُذكر أنها ضمن
      الترخيص المعلن في مدخله، كما أن أحد العاملين فيه يقدم خدمات علاجية
      دون أن يكون لديه تصنيف مهني ساري بحسب ما تبين لي عند الاستفسار.

      راجعت المجمع للاستيضاح فلم أتلق رداً واضحاً. وأرى أن الأمر يمس
      سلامة المرضى ويستدعي التحقق من التراخيص والتصنيف المهني للممارسين.

      مقدم البلاغ: أحمد بن عبدالرحمن الشمري
      الجوال: 0538814470

  # ---------- civil_defense ----------
  - id: cur-cd-001
    label: civil_defense
    difficulty: easy
    subject: بلاغ عن مستودع غير آمن
    text: |
      أفيدكم بوجود مستودع في نهاية شارع الأمير سلطان بحي الخالدية يخزن
      مواد دهانات ومذيبات في عبوات مكشوفة، ويقع في الدور الأرضي لمبنى
      سكني مأهول بأربع شقق.

      لا يوجد بالمستودع أي طفايات ظاهرة، والمخرج الوحيد مغلق بصناديق
      مكدسة حتى السقف، كما لوحظ تمديد كهربائي مؤقت ممتد من المبنى.

      نخشى وقوع كارثة، ونأمل الكشف على الموقع وإلزام صاحبه باستيفاء
      اشتراطات السلامة أو إخلاء الموقع.

      مقدم البلاغ: مشعل بن تركي الحربي

  - id: cur-cd-002
    label: civil_defense
    difficulty: easy
    subject: طلب كشف وإصدار شهادة سلامة
    text: |
      بصدد افتتاح فرع جديد لمنشأتنا في مدينة الخبر على مساحة 640 متراً
      مربعاً، وقد استكملنا تركيب شبكة الإنذار المبكر ورشاشات الإطفاء
      التلقائي، وتوفير مخرجين للطوارئ مع لوحات إرشادية مضيئة، وذلك وفق
      المخططات المعتمدة المرفقة.

      نطلب تحديد موعد للكشف الميداني وإصدار الشهادة اللازمة لاستكمال
      إجراءات التشغيل.

      المنشأة: شركة نماء للتجزئة
      السجل التجاري: 2051077431
      المفوض: ياسر بن عبدالله الغامدي

  - id: cur-cd-003
    label: civil_defense
    difficulty: medium
    subject: محضر مباشرة بلاغ
    text: |
      باشر الفريق البلاغ الوارد الساعة 02:17 عن اشتعال في الدور الأرضي
      لمبنى سكني مكون من أربعة أدوار بحي العزيزية.

      عند الوصول كان الحريق محصوراً في غرفة الكهرباء وامتد الدخان إلى
      بئر السلم. تمت السيطرة خلال 21 دقيقة، وأُخلي 14 شخصاً عبر سلم
      الطوارئ دون إصابات تذكر، وسُلّم شخصان يعانيان من استنشاق دخان
      إلى الفرقة الإسعافية في الموقع.

      المبدئي يرجح تماساً كهربائياً في لوحة التوزيع الرئيسية.

      قائد الفرقة: رقيب / فيصل بن حمود السبيعي

  - id: cur-cd-004
    label: civil_defense
    difficulty: hard
    subject: إيقاف أعمال في موقع إنشائي
    text: |
      بناءً على الكشف الميداني على المبنى تحت الإنشاء بحي الملقا، والذي
      يحمل رخصة بناء سارية صادرة من الجهة البلدية المختصة، تبين ما يلي:

      - عدم توفر أي وسيلة إطفاء في الموقع رغم وجود أعمال لحام مستمرة.
      - تخزين أسطوانات غاز بجوار مواد قابلة للاشتعال.
      - سكن عمال داخل الموقع في غرف مؤقتة بلا مخرج طوارئ.

      وحيث إن ما سبق يشكل خطراً داهماً، صدر التوجيه بإيقاف أعمال اللحام
      وإخلاء السكن المؤقت حتى استيفاء الاشتراطات. ولا تتضمن هذه المذكرة
      أي مساس بالرخصة ذاتها.

      المفتش: نقيب / عبدالعزيز بن مانع الدوسري

  - id: cur-cd-005
    label: civil_defense
    difficulty: hard
    subject: بشأن جاهزية منشأة صحية
    text: |
      إلحاقاً للجولة التفتيشية على المجمع الطبي بحي النزهة، نفيد بأن
      المنشأة تعمل بكامل طاقتها إلا أن خطة الإخلاء المعلقة غير محدثة منذ
      عامين، ولا تتضمن الدور الثالث المضاف حديثاً، كما أن بابين من أبواب
      الطوارئ مغلقان بسلاسل.

      المطلوب تحديث الخطة، وتنفيذ فرضية إخلاء موثقة، وفك إغلاق المخارج
      خلال خمسة عشر يوماً.

      ملحوظة: ما ورد أعلاه يخص جاهزية المبنى ووسائل الحماية فقط، ولا
      علاقة له بالخدمات العلاجية المقدمة داخل المجمع.

      رئيس فريق التفتيش: ملازم / وليد بن سعود العنزي

  # ---------- moe_education ----------
  - id: cur-moe-001
    label: moe_education
    difficulty: easy
    subject: طلب معادلة شهادة جامعية
    text: |
      حصلت على درجة البكالوريوس في هندسة الحاسب من جامعة خارج المملكة
      بتاريخ 19 ذو القعدة 1445هـ، وأرفق طيه الشهادة الأصلية وكشف الدرجات
      مصدقين من الملحقية الثقافية والجهات المختصة.

      أتقدم بطلب معادلة الشهادة لاستكمال إجراءات التوظيف لدى جهة تشترط
      وجود المعادلة قبل التعاقد.

      مقدم الطلب: طلال بن مشعل البقمي
      رقم الهوية: 1085530092
      الجوال: 0559023877

  - id: cur-moe-002
    label: moe_education
    difficulty: easy
    subject: شكوى ولي أمر بشأن الحافلة
    text: |
      ابنتي طالبة في الصف الخامس بإحدى مدارس حي السلامة، وتتأخر الحافلة
      يومياً ما بين ثلاثين وخمسين دقيقة عن موعد الحضور، مما أدى إلى
      احتساب غياب متكرر لها في الحصة الأولى.

      راجعت إدارة المدرسة أكثر من مرة، وأُفدت بأن المتعهد لم يلتزم بعدد
      الحافلات المتفق عليه.

      أرجو معالجة الوضع أو تمكيني من نقلها إلى مسار آخر.

      ولي الأمر: عادل بن سعد الزهراني
      الجوال: 0544128806

  - id: cur-moe-003
    label: moe_education
    difficulty: medium
    subject: طلب نقل طالب
    text: |
      نظراً لانتقال سكننا من مدينة بريدة إلى حي النرجس بالرياض اعتباراً
      من مطلع الفصل الدراسي الثاني، أتقدم بطلب نقل ابني من مدرسته الحالية
      إلى أقرب مدرسة لمقر السكن الجديد.

      أرفق صورة عقد الإيجار الموثق، وصورة سجل الأسرة، وآخر شهادة درجات.

      وأفيد بأن الطالب لديه خطة دعم تعليمي فردية، وآمل مراعاة استمرارها
      في المدرسة الجديدة.

      ولي الأمر: يوسف بن إبراهيم العتيبي

  - id: cur-moe-004
    label: moe_education
    difficulty: hard
    subject: بشأن سلامة مبنى مدرسي
    text: |
      نفيدكم بأن المبنى المستأجر الذي تشغله المدرسة بحي الشفا يعاني من
      تشققات ظاهرة في جدار الفناء الخلفي، وقد اتسعت خلال الفصل الحالي.

      وقد سبق أن أُبلغت الجهات المعنية بالسلامة وتمت معاينة الموقع من
      ناحية الحماية المدنية، إلا أن ما نطلبه هنا هو النظر في مناسبة
      المبنى لاستمرار العملية التعليمية، والنظر في نقل الطالبات إلى مبنى
      بديل، وهو ما يخرج عن اختصاص جهة السلامة.

      مديرة المدرسة: أ. سارة بنت عبدالله الشهري

  - id: cur-moe-005
    label: moe_education
    difficulty: hard
    subject: اعتراض على نتيجة اختبار
    text: |
      تقدمت لاختبار نهاية الفصل لمقرر الرياضيات، وظهرت نتيجتي بدرجة لا
      تتفق مع أدائي في الاختبارات الفصلية والواجبات، وعند مراجعة المعلم
      أُفدت بأن ورقتي صُححت آلياً ولا يمكن إعادة النظر فيها.

      أطلب إعادة تصحيح ورقتي يدوياً ومراجعة رصد الدرجات، حيث إن النتيجة
      أثرت على معدلي العام ومسار قبولي الجامعي.

      الطالب: راكان بن نواف المطيري
      رقم السجل المدني: 1103882771

  # ---------- hrsd_labor ----------
  - id: cur-hrsd-001
    label: hrsd_labor
    difficulty: easy
    subject: شكوى تأخر صرف الأجور
    text: |
      أعمل لدى المنشأة الموضحة أدناه منذ 4 صفر 1443هـ بموجب عقد عمل
      موثق، وقد تأخر صرف راتبي عن خمسة أشهر متتالية، آخر ما استلمته كان
      عن شهر رمضان الماضي.

      راجعت الإدارة مراراً وأُبلغت بوجود تعثر مالي دون تحديد موعد للصرف،
      كما توقف تحديث البيانات في نظام حماية الأجور منذ ذلك التاريخ.

      أطلب إلزام صاحب العمل بصرف مستحقاتي المتأخرة البالغة 46,500 ريال.

      مقدم الشكوى: عبدالله بن مبارك القحطاني
      المنشأة: مؤسسة الديار الحديثة للتشغيل والصيانة

  - id: cur-hrsd-002
    label: hrsd_labor
    difficulty: easy
    subject: طلب نقل خدمات
    text: |
      أتقدم بطلب نقل خدماتي إلى منشأة أخرى وافقت على استقدامي، وذلك
      للأسباب الآتية:

      - عدم التزام صاحب العمل الحالي ببنود العقد فيما يخص ساعات العمل،
        حيث يتجاوز الدوام اثنتي عشرة ساعة يومياً دون بدل.
      - عدم منحي الإجازة السنوية منذ عامين رغم تقديم الطلبات المرفقة.

      أرفق صورة العقد، وصور طلبات الإجازة، وموافقة المنشأة الجديدة.

      مقدم الطلب: راجيش كومار
      رقم الإقامة: 2447811093

  - id: cur-hrsd-003
    label: hrsd_labor
    difficulty: medium
    subject: اعتراض على إنهاء عقد
    text: |
      فوجئت بقرار إنهاء عقدي بعد خدمة استمرت ست سنوات وثلاثة أشهر، دون
      إشعار مسبق ودون بيان سبب نظامي، وقد سُلمت خطاب الإنهاء في نفس يوم
      إيقاف صلاحياتي.

      لم أتلق أي إنذار كتابي سابق، ولا يوجد في ملفي أي مخالفة، وآخر
      تقييم أداء لي كان بدرجة ممتاز.

      أطلب النظر في التعويض عن إنهاء العقد لسبب غير مشروع، وصرف مكافأة
      نهاية الخدمة ورصيد الإجازات.

      مقدمه: هيا بنت فهد الدوسري

  - id: cur-hrsd-004
    label: hrsd_labor
    difficulty: hard
    subject: مطالبة بأجر فترة انقطاع بعد إصابة
    text: |
      أصبت أثناء تأدية عملي بتاريخ 17 رجب 1446هـ إثر سقوط من سقالة في
      موقع المشروع، ونُقلت للمستشفى وبقيت منوماً أحد عشر يوماً ثم أُجيزت
      مرضياً لمدة شهر.

      قامت المنشأة بتسجيل الإصابة لدى الجهة التأمينية وأنا لا أنازع في
      ذلك ولا في تقدير أي عجز. مطالبتي هنا مقصورة على أن صاحب العمل
      امتنع عن صرف الفرق المستحق عليه نظاماً عن فترة الانقطاع، واحتسبها
      خصماً من رصيد إجازاتي السنوية.

      أطلب إلزامه بصرف الفرق ورد الإجازات المخصومة.

      مقدمه: محمد بن عوض الشهري

  - id: cur-hrsd-005
    label: hrsd_labor
    difficulty: hard
    subject: طلب بشأن معاش الضمان الاجتماعي
    text: |
      أفيدكم بأنني أرملة وأعول ثلاثة أبناء، وكنت مستفيدة من معاش الضمان
      الاجتماعي حتى شهر جمادى الآخرة 1446هـ، حيث أُوقف الصرف دون إشعار.

      عند الاستفسار أُفدت بأن السبب وجود دخل مسجل باسمي، وهو في الحقيقة
      عائد لسجل تجاري قديم متوقف عن النشاط منذ ثلاث سنوات وأرفق ما يثبت
      إيقافه.

      أطلب إعادة دراسة الأهلية وصرف المستحق عن الأشهر الموقوفة.

      مقدمة الطلب: أمل بنت سالم الغامدي
      رقم الهوية: 1044920883
