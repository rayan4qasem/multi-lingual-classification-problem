# Curated Arabic corpus, part 2 of 3 — institutions 8-14.
documents:

  # ---------- gosi ----------
  - id: cur-gosi-001
    label: gosi
    difficulty: easy
    subject: طلب صرف معاش تقاعدي
    text: |
      أفيدكم بأنني أكملت مدة الاشتراك النظامية البالغة ثلاثاً وعشرين سنة
      وأربعة أشهر، وبلغت السن المقررة بتاريخ 2 شعبان 1446هـ، وقد انتهت
      علاقتي بآخر منشأة عملت لديها في نهاية الشهر ذاته.

      أتقدم بطلب صرف المعاش التقاعدي اعتباراً من التاريخ المذكور، مرفقاً
      به بيان مدة الاشتراك، وصورة الهوية، وشهادة الآيبان.

      مقدم الطلب: ناصر بن سليمان الحربي
      رقم المشترك: 3399142077

  - id: cur-gosi-002
    label: gosi
    difficulty: easy
    subject: اعتراض على بيان مدة الاشتراك
    text: |
      عند استخراج بيان مدة الاشتراك لاحظت عدم إدراج الفترة من 1/1439 إلى
      6/1441، رغم أنني كنت على رأس العمل خلالها لدى منشأة مسجلة، وأرفق
      صورة العقد وكشوف الرواتب البنكية عن تلك الفترة.

      يترتب على هذا النقص فارق في احتساب المدة يبلغ نحو سنتين ونصف، مما
      يؤثر مباشرة على استحقاقي مستقبلاً.

      أطلب تصحيح البيان وضم المدة المذكورة بعد التحقق منها.

      مقدمه: صالح بن عبدالمحسن العتيبي
      رقم المشترك: 3277081455

  - id: cur-gosi-003
    label: gosi
    difficulty: medium
    subject: إشعار إصابة عمل وتقدير عجز
    text: |
      نفيدكم بتعرض المشترك الموضحة بياناته أدناه لإصابة أثناء العمل
      بتاريخ 9 رجب 1446هـ، نتج عنها بتر جزئي في إصبعين من اليد اليسرى
      إثر انحشارها في آلة قطع داخل المصنع.

      استكمل العلاج وانتهت فترة العلاج بتاريخ 20 رمضان 1446هـ، ويرفق
      طيه التقرير الطبي النهائي، ومحضر الحادثة الداخلي، وبيان ساعات
      العمل يوم الواقعة.

      يرجى إحالته للجنة الطبية لتقدير نسبة العجز المستديم وصرف ما يستحق.

      المنشأة: مصنع الرواد للصناعات المعدنية
      رقم المشترك: 3410229866

  - id: cur-gosi-004
    label: gosi
    difficulty: hard
    subject: بشأن اشتراكات لم تُسدد عن موظف
    text: |
      أفيدكم بأنني عملت لدى منشأة خاصة لمدة أربع سنوات، وكان يُخصم من
      راتبي شهرياً نصيبي من الاشتراكات بحسب ما هو مثبت في مسيرات الرواتب
      المرفقة، إلا أنه تبين لي عند الاستعلام أن المنشأة لم تورد تلك
      المبالغ ولم تسجلني إلا في السنة الأخيرة فقط.

      لا أطلب هنا الفصل في علاقتي بصاحب العمل ولا مستحقات نهاية الخدمة،
      فذلك محل إجراء آخر مستقل. طلبي منحصر في تسجيل المدة غير المسجلة
      ومطالبة المنشأة بتوريد الاشتراكات المستحقة عنها.

      مقدمه: إبراهيم بن عوض الزهراني
      رقم الهوية: 1071193028

  - id: cur-gosi-005
    label: gosi
    difficulty: hard
    subject: طلب صرف معاش لمستحقين
    text: |
      توفي والدي رحمه الله بتاريخ 12 شوال 1446هـ وكان مشتركاً وله معاش
      تقاعدي يُصرف شهرياً، ويعول والدتي وأخوين قاصرين وأختاً غير متزوجة.

      أرفق شهادة الوفاة، وصك حصر الورثة، وصور هويات المستحقين.

      نطلب تحويل المعاش إلى المستحقين وفق الأنصبة النظامية، وإفادتنا
      بما يلزم من مستندات إضافية إن وُجدت.

      مقدم الطلب: عبدالرحمن بن ناصر البقمي

  # ---------- zatca ----------
  - id: cur-zatca-001
    label: zatca
    difficulty: easy
    subject: اعتراض على ربط ضريبي
    text: |
      استلمت إشعار الربط رقم 46-VAT-118207 المتضمن فروقات في ضريبة القيمة
      المضافة عن الفترة المنتهية في 30 ذو الحجة 1446هـ بمبلغ 214,300 ريال.

      لدينا مستندات تثبت أن جزءاً من المبيعات المحتسبة يمثل صادرات معفاة
      بموجب بيانات جمركية مرفقة، كما أن مشتريات بقيمة 87,000 ريال لم
      تُحتسب ضمن الضريبة المدخلة رغم توفر فواتيرها النظامية.

      نتقدم بالاعتراض خلال المدة النظامية، ونطلب إعادة احتساب الربط.

      المنشأة: شركة المدى للتجارة
      الرقم الضريبي: 300442119800003

  - id: cur-zatca-002
    label: zatca
    difficulty: easy
    subject: استفسار عن ربط الفوترة الإلكترونية
    text: |
      منشأتنا مسجلة في ضريبة القيمة المضافة منذ عام 1441هـ، وإيراداتها
      السنوية تقارب أربعة ملايين ريال.

      نستفسر عن المتطلبات الفنية لربط نظام الفوترة لدينا بالمنصة في مرحلة
      التكامل، وعن الشريحة التي تندرج تحتها منشأتنا والموعد المحدد لها،
      وهل يلزم اعتماد مزود حلول معتمد أم يمكن التطوير الداخلي.

      المنشأة: مؤسسة الضياء للتجهيزات
      الرقم الضريبي: 300771204500003

  - id: cur-zatca-003
    label: zatca
    difficulty: medium
    subject: طلب إنهاء إجراءات فسح إرسالية
    text: |
      لدينا إرسالية واردة عبر أحد المنافذ البحرية بموجب البيان رقم
      6633120945، تحتوي على قطع غيار صناعية، وقد استُكملت جميع المستندات
      المطلوبة من شهادة منشأ وفاتورة وبوليصة شحن.

      مضى على وصول الإرسالية أحد عشر يوماً وما زالت موقوفة بانتظار
      الفحص، وتترتب علينا أرضيات يومية في الميناء.

      نأمل سرعة إنهاء الإجراءات أو إفادتنا بسبب التأخير.

      المخلص الجمركي: تركي بن سعد العنزي
      رقم الترخيص: 55019

  - id: cur-zatca-004
    label: zatca
    difficulty: hard
    subject: بشأن امتناع منشأة عن إصدار فاتورة نظامية
    text: |
      قمت بشراء أجهزة من منشأة بمبلغ إجمالي 63,000 ريال شامل الضريبة،
      وعند طلب الفاتورة الضريبية سلمني البائع سند قبض يدوياً لا يحمل
      رقماً ضريبياً ولا يستوفي عناصر الفاتورة النظامية، ورفض إصدار غيره.

      أوضح أن شكواي هنا تخص عدم إصدار فاتورة ضريبية نظامية والتحقق من
      إقرار المنشأة بالضريبة المحصلة مني، لا جودة الأجهزة نفسها ولا
      علاقتي التعاقدية بالبائع.

      مقدم البلاغ: وليد بن عبدالله السبيعي
      الرقم الضريبي للمنشأة كما ظهر في لوحتها: 300118776600003

  - id: cur-zatca-005
    label: zatca
    difficulty: hard
    subject: طلب إعادة نظر في تصنيف سلعة
    text: |
      وردت إرسالية باسم منشأتنا وصُنفت ضمن بند تعريفي يخضع لرسوم بنسبة
      15%، في حين أن السلعة عبارة عن مدخلات إنتاج تستخدم في التصنيع
      المحلي وتخضع لبند آخر بنسبة 5% بحسب التصنيف المعتمد لدينا في
      إرساليات سابقة مماثلة أرفق بياناتها.

      نطلب إعادة النظر في التصنيف واسترداد الفرق المحصل والبالغ
      118,400 ريال.

      المنشأة: مصنع الخليج للبلاستيك
      الرقم الضريبي: 301209884400003

  # ---------- mci_commerce ----------
  - id: cur-mci-001
    label: mci_commerce
    difficulty: easy
    subject: بلاغ عن منتج مقلد
    text: |
      اشتريت جهازاً إلكترونياً من محل بحي العليا بمبلغ 4,300 ريال على أنه
      أصلي وبضمان الوكيل، وعند مراجعة مركز الصيانة المعتمد أُفدت بأن
      الرقم التسلسلي غير مسجل لدى الوكيل وأن الجهاز مقلد.

      راجعت المحل فرفض الاسترجاع أو الاستبدال بحجة مرور مدة على الشراء.

      أرفق الفاتورة وإفادة مركز الصيانة، وأطلب اتخاذ الإجراء النظامي
      بحق المحل.

      مقدم البلاغ: فيصل بن ماجد الشمري
      الجوال: 0507712093

  - id: cur-mci-002
    label: mci_commerce
    difficulty: easy
    subject: طلب تعديل بيانات سجل تجاري
    text: |
      أرغب في تعديل النشاط المدون في السجل التجاري رقم 1010449271 بإضافة
      نشاط تجارة الجملة في المواد الغذائية، وحذف نشاط لم تعد المنشأة
      تزاوله، مع تحديث عنوان المقر الرئيسي إلى مدينة الدمام.

      أرفق صورة السجل الحالي، وعقد الإيجار الموثق للمقر الجديد، وقرار
      الشركاء بالتعديل.

      المفوض بالتوقيع: منصور بن علي الغامدي

  - id: cur-mci-003
    label: mci_commerce
    difficulty: medium
    subject: شكوى امتناع عن تنفيذ الضمان
    text: |
      تعطل جهاز التكييف المركزي الذي اشتريته بتاريخ 8 محرم 1446هـ خلال
      فترة الضمان الموضحة في الفاتورة المرفقة، وعند مطالبة التاجر
      بالإصلاح رفض بحجة سوء الاستخدام دون تقديم أي تقرير فني يثبت ذلك.

      طلبت منه كتابياً إحالة الجهاز إلى الوكيل للفحص فامتنع.

      أطلب إلزامه بتنفيذ التزامات الضمان أو استبدال الجهاز.

      مقدم الشكوى: عبدالعزيز بن راشد المطيري

  - id: cur-mci-004
    label: mci_commerce
    difficulty: hard
    subject: بلاغ عن إعلانات مضللة لمنشأة
    text: |
      تروج منشأة عبر حساباتها لتخفيضات بنسبة تصل إلى 70%، وعند الشراء
      تبين أن السعر المعروض قبل التخفيض مضخم ولم يُبع به فعلياً في أي
      وقت، كما أن العروض المعلنة غير متوفرة في الفروع.

      كما لوحظ عرض منتجات على أنها من علامة تجارية معروفة دون أن تكون
      المنشأة وكيلاً أو موزعاً معتمداً لها.

      شكواي تنصب على الممارسة التجارية والإعلان المضلل واستخدام العلامة،
      وأرفق لقطات من الإعلانات وفواتير الشراء.

      مقدم البلاغ: خالد بن سليمان القحطاني

  - id: cur-mci-005
    label: mci_commerce
    difficulty: hard
    subject: نزاع بين شركاء وطلب تصفية
    text: |
      نحن شركاء في شركة ذات مسؤولية محدودة برأس مال قدره مليون ريال،
      وقد توقفت الشركة عن ممارسة نشاطها منذ أكثر من عام، ويرفض الشريك
      المدير تسليم الدفاتر أو عقد الجمعية العامة رغم الإنذارات المرفقة.

      نطلب اتخاذ ما يلزم نظاماً بشأن مخالفة المدير لالتزاماته، والنظر في
      حل الشركة وتصفيتها وتعيين مصفٍ.

      مقدمو الطلب: شركاء يمثلون 62% من رأس المال
      السجل التجاري: 4030771209

  # ---------- momah_municipal ----------
  - id: cur-momah-001
    label: momah_municipal
    difficulty: easy
    subject: طلب رخصة بناء
    text: |
      أملك قطعة أرض سكنية بحي الياسمين، رقم القطعة 447 من المخطط 2911،
      بموجب الصك المرفق، ومساحتها 600 متر مربع.

      أرغب في استخراج رخصة بناء لفيلا سكنية بدورين وملحق، وفق المخططات
      المعتمدة من المكتب الهندسي المرفقة والتي روعيت فيها الارتدادات
      ونسب البناء المقررة للمخطط.

      أرفق: صورة الصك، الكروكي، المخططات المعمارية والإنشائية، وشهادة
      المكتب الهندسي.

      مقدم الطلب: عمر بن صالح الدوسري

  - id: cur-momah-002
    label: momah_municipal
    difficulty: easy
    subject: بلاغ عن تراكم مخلفات
    text: |
      تتراكم مخلفات البناء ونفايات منزلية في الأرض الفضاء المقابلة
      لمنزلي بحي الخالدية منذ نحو ثلاثة أسابيع دون رفع، وقد انتشرت
      الروائح والقوارض وأصبحت مصدر إزعاج للسكان.

      كما يقوم بعض سائقي الشاحنات بإلقاء مخلفات إضافية ليلاً في الموقع
      ذاته.

      نأمل التوجيه برفع المخلفات وتسوير الأرض وإلزام مالكها بنظافتها.

      مقدم البلاغ: سلمان بن فهد العنزي
      الجوال: 0561120884

  - id: cur-momah-003
    label: momah_municipal
    difficulty: medium
    subject: شكوى إشغال رصيف وأرصفة
    text: |
      قام عدد من المحلات التجارية في شارع التخصصي بوضع بضائع ومظلات
      وطاولات تشغل الرصيف بالكامل على امتداد أكثر من مائة متر، مما
      يضطر المشاة والأطفال للسير في الشارع بين المركبات.

      كما أُغلق منحدر ذوي الإعاقة عند تقاطع الشارع بصناديق عرض.

      نأمل إزالة التعديات وإعادة الرصيف لوضعه النظامي.

      مقدم الشكوى: بدر بن عبدالله الحربي

  - id: cur-momah-004
    label: momah_municipal
    difficulty: hard
    subject: بلاغ عن مطعم يصرف مخلفاته للشارع
    text: |
      يقوم مطعم بحي السلامة بتصريف مياه ومخلفات المطبخ عبر خرطوم ممتد
      إلى الشارع العام مباشرة، مما أدى إلى تجمعات مائية دائمة أمام
      المحلات المجاورة وانبعاث روائح كريهة، خصوصاً في ساعات الذروة.

      كما أن مصيدة الشحوم الظاهرة خلف المحل ممتلئة وتفيض على الرصيف.

      طلبي هو مخالفة المحل وإلزامه بالتصريف النظامي وتصحيح وضع المصيدة،
      وهو ما يتعلق بنظافة الموقع واشتراطات المحل التجاري.

      مقدم البلاغ: أنس بن محمد الزهراني

  - id: cur-momah-005
    label: momah_municipal
    difficulty: hard
    subject: بشأن حفريات وأضرار بالطريق الداخلي
    text: |
      نفيدكم بأن الشارع الداخلي المؤدي إلى مدرسة البنات بحي الروضة قد
      حُفر قبل نحو خمسة أشهر لتمديد خدمات، وأُعيد ردمه بشكل غير مستوٍ
      دون سفلتة، مما تسبب في هبوط في ثلاثة مواضع وتجمع مياه الأمطار فيها.

      وقد سقطت إحدى الطالبات في أحد المواضع الشهر الماضي.

      المطلوب معالجة الهبوط وإعادة سفلتة الشارع وإلزام المتعهد المنفذ
      بإصلاح ما أحدثه، علماً بأن الشارع داخلي ضمن نطاق الحي ولا يتبع
      شبكة الطرق بين المدن.

      وكيل السكان: نواف بن تركي البقمي

  # ---------- mot_transport ----------
  - id: cur-mot-001
    label: mot_transport
    difficulty: easy
    subject: شكوى عن حالة طريق بين مدينتين
    text: |
      الطريق الرابط بين المحافظة ومركز الإمارة على امتداد نحو 70
      كيلومتراً يعاني من حفر عميقة على الكتف الأيمن، وطمس شبه كامل
      لخطوط التحديد، وغياب الإنارة على مقاطع طويلة منه.

      وقد شهد الطريق خلال الأشهر الستة الماضية عدداً من الحوادث، لا سيما
      عند المنحنى القريب من قرية الحفنة.

      نأمل إدراج الطريق ضمن خطط الصيانة العاجلة وتركيب العواكس والإنارة.

      مقدم الشكوى: عبدالله بن مسلم الشهري

  - id: cur-mot-002
    label: mot_transport
    difficulty: easy
    subject: طلب ترخيص نشاط نقل بضائع
    text: |
      نرغب في الحصول على ترخيص لمزاولة نشاط نقل البضائع بالشاحنات على
      الطرق البرية داخل المملكة.

      بيانات المنشأة: سجل تجاري رقم 2050991174، ويبلغ عدد الشاحنات
      المملوكة لنا اثنتي عشرة شاحنة مقطورة، جميعها موديلات بعد 2019،
      ولدينا مستودع ومركز صيانة في المنطقة الصناعية.

      أرفق: السجل التجاري، بيان الأسطول، وعقود السائقين.

      المفوض: مشعل بن ناصر العتيبي

  - id: cur-mot-003
    label: mot_transport
    difficulty: medium
    subject: شكوى ضد شركة نقل ركاب
    text: |
      حجزت رحلة على حافلة من الرياض إلى القصيم بتاريخ 5 رجب 1446هـ
      الساعة العاشرة صباحاً، وتأخر الانطلاق أربع ساعات دون إشعار أو
      تفسير، ثم أُلغيت الرحلة نهائياً وطُلب منا الانتظار لليوم التالي.

      رفضت الشركة رد قيمة التذاكر أو تأمين بديل، ولم يتوفر أي منسق في
      المحطة للرد على المسافرين.

      أطلب إلزام الشركة برد القيمة والنظر في التزامها بشروط الترخيص.

      مقدم الشكوى: يزيد بن سعود القحطاني

  - id: cur-mot-004
    label: mot_transport
    difficulty: hard
    subject: بشأن شاحنات تسلك مساراً غير مخصص
    text: |
      نفيدكم بأن شاحنات نقل الحاويات المتجهة إلى المنطقة الصناعية تسلك
      الطريق الزراعي الفرعي بدلاً من المسار المخصص لها، وهو طريق غير
      مصمم لهذه الأحمال، مما أدى إلى تكسر الأكتاف وهبوط في الطبقة
      الأسفلتية على مسافة تقارب ثلاثة كيلومترات.

      المطلوب النظر في تحديد المسارات الملزمة لهذه الأحمال ووضع اللوحات
      الإرشادية، وتقييم الطريق إنشائياً.

      وأنوه إلى أن طلبنا يخص المسار وتحمّل الطريق، لا مخالفات السائقين
      الفردية التي تُعالج في موضع آخر.

      رئيس المجلس البلدي الفرعي: سعود بن عبدالرحمن الغامدي

  - id: cur-mot-005
    label: mot_transport
    difficulty: hard
    subject: شكوى بشأن تطبيق نقل توصيل
    text: |
      أعمل سائقاً عبر أحد تطبيقات نقل الركاب منذ عامين، وقد أوقف التطبيق
      حسابي فجأة بحجة مخالفة الشروط دون تحديد المخالفة، واحتجز رصيداً
      مستحقاً لي قدره 7,850 ريالاً.

      أوضح أنني لست موظفاً لدى التطبيق بل سائق مرخص أعمل عبر منصته،
      وشكواي تخص التزام المنصة بشروط ترخيص نشاط نقل الركاب وضوابط
      تعاملها مع السائقين المرخصين.

      مقدم الشكوى: أحمد بن عايض السبيعي
      رقم بطاقة التشغيل: 8841207

  # ---------- civil_affairs ----------
  - id: cur-ca-001
    label: civil_affairs
    difficulty: easy
    subject: طلب إصدار بدل فاقد للهوية
    text: |
      فقدت هويتي الوطنية أثناء سفري داخل المملكة بتاريخ 14 شعبان 1446هـ،
      وقد بحثت عنها في الأماكن التي ارتدتها دون جدوى.

      أتقدم بطلب إصدار بدل فاقد، مرفقاً به صورة من سجل الأسرة وصورة
      شخصية حديثة بالمقاس المعتمد.

      وأفيد بأنه لم يسبق لي استخراج بدل فاقد من قبل.

      مقدم الطلب: طارق بن عبدالكريم المطيري
      رقم السجل المدني: 1088204471

  - id: cur-ca-002
    label: civil_affairs
    difficulty: easy
    subject: طلب تسجيل مولود
    text: |
      رزقنا بمولود ذكر بتاريخ 3 رمضان 1446هـ في أحد المستشفيات بمدينة
      جدة، وأرفق طيه إشعار الولادة الصادر من المستشفى.

      أطلب تسجيله في سجل الأسرة باسم "سليمان"، واستخراج شهادة الميلاد
      الخاصة به.

      بيانات الوالد: عبدالله بن سليمان الشمري، سجل مدني 1055992077
      بيانات الوالدة: نوف بنت خالد العتيبي

  - id: cur-ca-003
    label: civil_affairs
    difficulty: medium
    subject: طلب تصحيح اسم في السجل
    text: |
      ورد اسم والدتي في سجل الأسرة الخاص بي بصيغة تختلف عما هو مثبت في
      وثائقها الرسمية وفي سجل أسرة والدها، حيث كُتب "نجود" بينما الصحيح
      "نجوى" بحسب المستندات المرفقة.

      وقد ترتب على هذا الاختلاف تعطل معاملة تخصني لدى جهة أخرى طلبت
      تطابق الأسماء.

      أطلب تصحيح القيد وفق المستندات المرفقة.

      مقدم الطلب: زياد بن فيصل الدوسري

  - id: cur-ca-004
    label: civil_affairs
    difficulty: hard
    subject: قيد واقعة وفاة حصلت خارج المملكة
    text: |
      توفي والدي رحمه الله أثناء وجوده خارج المملكة بتاريخ 27 جمادى
      الأولى 1446هـ، وقد صدرت شهادة الوفاة من الجهة المختصة هناك
      ومصدقة من السفارة، وأرفق صورتها مع الترجمة المعتمدة.

      أطلب قيد واقعة الوفاة في السجل المدني وتحديث سجل الأسرة تبعاً
      لذلك.

      وأفيد بأن ما يتعلق بحصر الورثة وقسمة التركة يجري في مسار مستقل
      ولا يشمله هذا الطلب.

      مقدم الطلب: ماجد بن عبدالله الحربي

  - id: cur-ca-005
    label: civil_affairs
    difficulty: hard
    subject: تحديث الحالة الاجتماعية في السجل
    text: |
      صدر صك الطلاق المرفق بتاريخ 8 رجب 1446هـ وأصبح نهائياً، إلا أن
      حالتي الاجتماعية ما زالت مقيدة في السجل على أنها متزوجة، مما
      أدى إلى رفض إحدى معاملاتي لعدم تطابق البيانات.

      أطلب تحديث الحالة الاجتماعية في السجل بناءً على الصك المرفق،
      وإصدار سجل أسرة محدث.

      علماً بأنني لا أطلب هنا أي إجراء يتعلق بأثر الطلاق من نفقة أو
      حضانة، فذلك قائم في مساره.

      مقدمة الطلب: جواهر بنت مسفر الزهراني

  # ---------- mewa_environment ----------
  - id: cur-mewa-001
    label: mewa_environment
    difficulty: easy
    subject: شكوى ضعف وانقطاع المياه
    text: |
      ينقطع التيار المائي عن الجزء الشرقي من حي النخيل بشكل شبه يومي
      لفترات تمتد من الظهر حتى ما بعد منتصف الليل، ويستمر هذا الوضع منذ
      أكثر من شهرين.

      اضطر معظم السكان إلى شراء الصهاريج على حسابهم الخاص بمعدل مرتين
      أسبوعياً، رغم انتظامهم في سداد الفواتير.

      نأمل معالجة ضعف الضخ في الحي وإفادتنا بالخطة الزمنية.

      وكيل السكان: عبدالمحسن بن سعد الغامدي
      رقم الحساب: 7741209388

  - id: cur-mewa-002
    label: mewa_environment
    difficulty: easy
    subject: بلاغ عن تلوث مجرى وادٍ
    text: |
      تقوم إحدى المنشآت الواقعة على أطراف المدينة بتصريف مخلفات سائلة
      داكنة اللون في مجرى الوادي المجاور، خصوصاً في ساعات المساء.

      نتج عن ذلك تغير واضح في لون المياه ورائحة نفاذة، ونفوق أعداد من
      الأسماك في البرك الراكدة، كما ترعى الإبل في المنطقة نفسها.

      نأمل الكشف الميداني وأخذ عينات واتخاذ ما يلزم.

      مقدم البلاغ: مسفر بن حمد القحطاني

  - id: cur-mewa-003
    label: mewa_environment
    difficulty: medium
    subject: طلب رخصة مزرعة وتصريح بئر
    text: |
      أملك أرضاً زراعية مساحتها 18 هكتاراً بمنطقة القصيم بموجب الصك
      المرفق، وأرغب في استخراج رخصة لمزرعة إنتاج نباتي مكشوف وبيوت
      محمية.

      كما أطلب تصريحاً لحفر بئر لأغراض الري وفق الاشتراطات، مع تركيب
      عداد قياس، وأرفق الدراسة الفنية الأولية والكروكي.

      مقدم الطلب: سعود بن إبراهيم العنزي

  - id: cur-mewa-004
    label: mewa_environment
    difficulty: hard
    subject: بشأن طفح شبكة الصرف الصحي
    text: |
      يعاني حي الفيحاء من طفح متكرر لمياه الصرف الصحي من غرف التفتيش في
      ثلاثة شوارع، ويتكرر ذلك أسبوعياً منذ أربعة أشهر، وتنتشر المياه على
      مساحة واسعة قبل أن تُشفط بالصهاريج.

      وقد تبين أن الشبكة الرئيسية للحي غير كافية لاستيعاب التوسع العمراني
      الأخير، وهو ما يستدعي معالجة على مستوى الشبكة نفسها لا مجرد شفط
      متكرر أو تنظيف للشوارع.

      نأمل تقييم الشبكة ومعالجة أصل المشكلة.

      وكيل السكان: خالد بن عوض الشهري

  - id: cur-mewa-005
    label: mewa_environment
    difficulty: hard
    subject: بلاغ عن مبيدات غير مصرح بها
    text: |
      لاحظنا قيام أحد المزارعين المجاورين برش مبيدات في أوقات الرياح
      النشطة، وتصل رذاذها إلى مزرعتنا ومنازل العمال الملاصقة.

      وعند سؤاله أفاد بأنه يستخدم مركباً مستورداً عبر طرق غير رسمية،
      ولم نجد على العبوات أي بيانات تسجيل باللغة العربية.

      نخشى أثر ذلك على المحاصيل المجاورة وعلى صحة العاملين والثروة
      الحيوانية في المنطقة.

      مقدم البلاغ: عبدالله بن صالح البقمي
