# Curated Arabic corpus, part 3 of 3 — adversarial boundary cases.
#
# Two documents per declared confusion pair in config/taxonomy.yaml. Each is
# labeled with the institution that is actually competent, and worded to carry
# the surface signals of its partner. A model that routes on keywords alone
# should fail most of these; a model that routes on the requested action
# should get them.
documents:

  # ===== interior_public_security <-> public_prosecution =====
  - id: cur-bnd-001
    label: interior_public_security
    difficulty: hard
    pair: interior_public_security|public_prosecution
    subject: بلاغ عن نصب واحتيال
    text: |
      أفيدكم بأنني تعرضت لعملية احتيال حولت على إثرها مبلغ 38,000 ريال
      لحساب شخص عرض عليّ بضاعة عبر حساب في إحدى المنصات، ثم انقطع
      تواصله وأغلق الحساب.

      لدي صور المحادثات وإشعار التحويل البنكي واسم صاحب الحساب المستفيد.

      أرغب في تقديم بلاغ رسمي بالواقعة وضبط الشخص المذكور. علماً بأنه لم
      يسبق تقديم بلاغ في هذا الشأن، ولم تُفتح بشأنه أي قضية بعد.

      مقدم البلاغ: عبدالرحمن بن فهد العتيبي
      رقم الهوية: 1092208874

  - id: cur-bnd-002
    label: public_prosecution
    difficulty: hard
    pair: interior_public_security|public_prosecution
    subject: طلب بشأن مضبوطات في قضية
    text: |
      سبق أن تقدمت ببلاغ عن سرقة محتويات مستودعي، وباشرت الجهة الأمنية
      الواقعة وضبطت شخصين وبحوزتهما جزء من المسروقات، وأُحيلت الأوراق
      وقُيدت القضية برقم 46/2044 وجرى استجواب المضبوطين.

      أطلب التوجيه بتسليمي الأعيان المضبوطة العائدة لي بعد انتهاء الحاجة
      إليها في التحقيق، وأرفق ما يثبت ملكيتي لها من فواتير.

      أوجه طلبي إلى الجهة التي تتولى التحقيق حالياً وبيدها التصرف في
      المضبوطات، لا إلى الجهة التي باشرت الضبط ابتداءً.

      مقدمه: صالح بن مطلق الحربي

  # ===== public_prosecution <-> moj_courts =====
  - id: cur-bnd-003
    label: public_prosecution
    difficulty: hard
    pair: public_prosecution|moj_courts
    subject: طلب سماع شاهد قبل الإحالة
    text: |
      بصفتي وكيلاً عن المشتكى عليه في القضية رقم 46/1902، أطلب سماع أقوال
      شاهد لم يُسمع حتى الآن، وهو الوحيد الذي كان حاضراً وقت الواقعة،
      وأرفق بياناته وما يفيد استعداده للحضور.

      وأوضح أن الأوراق لم تُحل بعد إلى المحكمة، وما زالت في مرحلة جمع
      الاستدلالات والتحقيق، ولذا فإن طلبي موجه إلى الجهة التي تباشر
      التحقيق لا إلى جهة الفصل في الدعوى.

      المحامي: عبدالإله بن ناصر الشمري
      رقم الترخيص: 4409921

  - id: cur-bnd-004
    label: moj_courts
    difficulty: hard
    pair: public_prosecution|moj_courts
    subject: مطالبة بالحق الخاص عن واقعة جنائية
    text: |
      أفيدكم بأنه صدر حكم في القضية الجزائية رقم 46/0771 بإدانة الجاني
      عن واقعة الاعتداء التي تعرضت لها، واكتسب الحكم القطعية.

      وحيث إن الحكم اقتصر على الحق العام، فإنني أتقدم بدعواي هذه للمطالبة
      بالتعويض عن الأضرار الجسدية والنفسية وما تكبدته من تكاليف علاج
      بلغت 47,200 ريال، وأرفق التقارير والفواتير.

      طلبي منصب على الحق الخاص والفصل فيه، وقد انتهت مرحلة التحقيق
      والاتهام في هذه الواقعة.

      المدعي: بندر بن عايض الغامدي

  # ===== hrsd_labor <-> gosi =====
  - id: cur-bnd-005
    label: gosi
    difficulty: hard
    pair: hrsd_labor|gosi
    subject: بشأن إصابة عمل وتقدير العجز
    text: |
      أصبت أثناء عملي لدى منشأة مقاولات بتاريخ 3 شعبان 1446هـ، وقد
      سجلت المنشأة الإصابة وانتهى العلاج بتقرير طبي نهائي يفيد ببقاء
      محدودية دائمة في حركة الكتف.

      لا خلاف بيني وبين صاحب العمل على الأجر أو العقد أو نهاية الخدمة،
      وما زلت على رأس العمل لديه.

      طلبي منحصر في إحالتي إلى اللجنة الطبية لتقدير نسبة العجز المستديم
      وصرف التعويض المستحق عنه.

      مقدمه: فهد بن مرزوق السبيعي
      رقم المشترك: 3388120774

  - id: cur-bnd-006
    label: hrsd_labor
    difficulty: hard
    pair: hrsd_labor|gosi
    subject: خصم من الراتب باسم الاشتراكات
    text: |
      يقوم صاحب العمل بخصم مبالغ شهرية من راتبي تفوق النسبة النظامية
      لحصة الموظف، ويدرجها في المسير تحت بند التأمينات، ورفض تزويدي
      بتفصيل الاحتساب رغم طلبي الكتابي المرفق.

      أوضح أن اعتراضي هنا على تصرف صاحب العمل في أجري وعلى امتناعه عن
      بيان الخصومات، وهو ما يتعلق بعلاقتي التعاقدية به.

      أطلب إلزامه برد الفروق المخصومة بغير وجه حق وتصحيح المسير.

      مقدمه: أنور بن سعيد الزهراني

  # ===== zatca <-> mci_commerce =====
  - id: cur-bnd-007
    label: zatca
    difficulty: hard
    pair: zatca|mci_commerce
    subject: بشأن تحصيل ضريبة دون فاتورة نظامية
    text: |
      قمت بالشراء من محل تجاري وأضاف البائع نسبة 15% على السعر باعتبارها
      ضريبة، إلا أنه سلمني سنداً يدوياً لا يحمل رقماً ضريبياً ولا يستوفي
      عناصر الفاتورة النظامية، ورفض إصدار فاتورة إلكترونية.

      لا شكوى لدي على السلعة نفسها ولا على جودتها ولا على المحل من حيث
      ممارسته التجارية.

      بلاغي منصب على تحصيل مبلغ باسم الضريبة دون فاتورة نظامية، والتحقق
      من إقرار المنشأة بما حصلته.

      مقدم البلاغ: تركي بن عبدالله المطيري

  - id: cur-bnd-008
    label: mci_commerce
    difficulty: hard
    pair: zatca|mci_commerce
    subject: أسعار معلنة تخالف المحصل عند الدفع
    text: |
      يعرض أحد المتاجر أسعاراً على الرفوف تختلف عما يُحصل فعلياً عند
      نقطة البيع، وعند الاعتراض يُقال إن الفرق يعود إلى الضريبة، رغم أن
      اللوحات المعلقة تنص صراحة على أن الأسعار شاملة للضريبة.

      تكرر ذلك معي ثلاث مرات وبفروق تراوحت بين 6 و11 بالمائة، وأرفق صور
      الرفوف والفواتير.

      شكواي على مخالفة إعلان السعر وعدم مطابقة المعلن للمحصل، لا على
      احتساب الضريبة في ذاته.

      مقدم الشكوى: نايف بن سلطان الدوسري

  # ===== momah_municipal <-> civil_defense =====
  - id: cur-bnd-009
    label: civil_defense
    difficulty: hard
    pair: momah_municipal|civil_defense
    subject: مستودع داخل نطاق سكني بلا وسائل حماية
    text: |
      يوجد مستودع في الدور الأرضي لمبنى سكني بحي الربيع، يحمل رخصة نشاط
      سارية ومدون عليه لوحة نظامية.

      المشكلة أن المستودع يخزن مواد سريعة الاشتعال بجوار لوحة الكهرباء
      الرئيسية للمبنى، ولا توجد به أي وسيلة إطفاء أو إنذار، ومخرج
      الطوارئ الوحيد مغلق بالبضائع.

      بلاغي يتعلق بغياب وسائل الحماية والوقاية وخطر الحريق على السكان،
      لا بمخالفة الرخصة أو موقع النشاط.

      مقدم البلاغ: رائد بن حمود العنزي

  - id: cur-bnd-010
    label: momah_municipal
    difficulty: hard
    pair: momah_municipal|civil_defense
    subject: مبنى آيل للسقوط في حي سكني
    text: |
      يوجد مبنى قديم مهجور منذ سنوات في حي المروج، تساقطت أجزاء من
      واجهته على الرصيف، ويدخله العابثون ليلاً، وقد شبّ فيه حريق صغير
      قبل شهرين أُطفئ في حينه.

      المطلوب حصر وضع المبنى وإلزام مالكه بإزالته أو ترميمه وتسويره،
      وهو إجراء يتعلق بسلامة المباني ومخالفات البناء في النطاق البلدي.

      أما واقعة الحريق السابقة فقد بوشرت في حينها وانتهت، ولا نطلب
      إعادة النظر فيها.

      مقدم البلاغ: عبدالعزيز بن ماجد القحطاني

  # ===== momah_municipal <-> mot_transport =====
  - id: cur-bnd-011
    label: mot_transport
    difficulty: hard
    pair: momah_municipal|mot_transport
    subject: تقاطع خطر على طريق خارجي
    text: |
      التقاطع الواقع عند الكيلو 34 على الطريق الرابط بين المدينتين يفتقر
      إلى مسار تباطؤ وإلى لوحات تحذيرية كافية، وقد وقعت فيه عدة حوادث
      خلال العام الحالي.

      الطريق خارجي يربط بين مدينتين ولا يقع ضمن النطاق العمراني لأي
      منهما، والمطلوب دراسة التقاطع هندسياً وتنفيذ مسارات الدخول
      والخروج واللوحات اللازمة.

      لا يتعلق طلبنا بالشوارع الداخلية للحي المجاور ولا بنظافتها.

      مقدم الطلب: مهندس / سامي بن عبدالله البقمي

  - id: cur-bnd-012
    label: momah_municipal
    difficulty: hard
    pair: momah_municipal|mot_transport
    subject: مواقف ورصف شارع تجاري داخلي
    text: |
      الشارع التجاري في حي الورود يعاني من غياب تنظيم المواقف، حيث تصطف
      المركبات في الاتجاهين وتضيق الممر إلى مسار واحد، كما أن الرصف
      متهالك ومليء بالمطبات غير النظامية التي أنشأها أصحاب المحلات.

      المطلوب إعادة رصف الشارع وتخطيط المواقف وإزالة المطبات غير
      النظامية، وهو شارع داخلي ضمن نطاق الحي ولا يمثل جزءاً من شبكة
      الطرق الرابطة بين المدن.

      مقدم الطلب: وليد بن سالم الشهري

  # ===== civil_affairs <-> moj_courts =====
  - id: cur-bnd-013
    label: civil_affairs
    difficulty: hard
    pair: civil_affairs|moj_courts
    subject: تنفيذ مضمون صك في السجل
    text: |
      صدر الصك المرفق المتضمن إثبات تاريخ ميلاد ابني بعد أن تعذر إثباته
      بالطرق العادية، وقد اكتسب الصك صفته النهائية.

      أتقدم بطلب تنفيذ مضمونه في السجل المدني وتعديل تاريخ الميلاد
      المدون في سجل الأسرة، وإصدار سجل محدث.

      الفصل في الموضوع قد تم بالفعل بموجب الصك، وطلبي هنا مقصور على
      القيد والتحديث في السجل.

      مقدم الطلب: مازن بن عبدالرحمن الغامدي

  - id: cur-bnd-014
    label: moj_courts
    difficulty: hard
    pair: civil_affairs|moj_courts
    subject: دعوى تصحيح اسم لتعذر القيد
    text: |
      يختلف اسم جدي المدون في سجل الأسرة عما هو مثبت في وثائق التملك
      القديمة العائدة له، مما عطل نقل ملكية عقار موروث.

      راجعت الجهة المختصة بالسجل فأُفدت بأن هذا الاختلاف لا يمكن تعديله
      إدارياً لعدم وجود مستند رسمي معاصر يثبت التطابق، وأنه يلزم صدور
      حكم بذلك.

      لذا أقيم هذه الدعوى لسماع الشهود والحكم بتصحيح الاسم، تمهيداً
      لاستكمال القيد بعد ذلك.

      المدعي: حمد بن عبدالله العتيبي

  # ===== mewa_environment <-> momah_municipal =====
  - id: cur-bnd-015
    label: mewa_environment
    difficulty: hard
    pair: mewa_environment|momah_municipal
    subject: تلوث ناتج عن تصريف صناعي
    text: |
      تقوم منشأة صناعية على أطراف الحي بتصريف سائل داكن في مجرى طبيعي
      يمر بجوار مزارع قائمة، وقد تغير لون التربة على ضفتيه وظهرت طبقة
      زيتية على سطح الماء الراكد.

      المطلوب أخذ عينات وتحليلها وتقييم الأثر البيئي على المجرى والتربة
      والمياه الجوفية القريبة، واتخاذ ما يلزم بحق المنشأة.

      لا يتعلق بلاغنا بنظافة الشوارع أو رفع المخلفات من الأرصفة.

      مقدم البلاغ: خالد بن مسفر العنزي

  - id: cur-bnd-016
    label: momah_municipal
    difficulty: hard
    pair: mewa_environment|momah_municipal
    subject: تجمع مياه أمطار في شوارع الحي
    text: |
      تتجمع مياه الأمطار في ثلاثة مواضع من شوارع حي الندى بعد كل هطول،
      وتبقى راكدة أياماً حتى تُشفط بالصهاريج، بسبب هبوط في مستوى الشارع
      وانسداد فتحات تصريف السطح.

      المطلوب معالجة منسوب الشارع وتنظيف شبكة تصريف مياه الأمطار
      السطحية وصيانة الفتحات، وهي أعمال تخص الشوارع داخل نطاق الحي.

      وأنوه إلى أن شبكة الصرف الصحي في الحي تعمل بصورة طبيعية ولا شكوى
      لدينا بشأنها ولا بشأن جودة مياه الشرب.

      مقدم البلاغ: سعد بن يوسف الحربي
