[project]
name = "docrouter"
version = "0.1.0"
description = "Arabic government document classification and routing to Saudi institutions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pymupdf>=1.24",
    "pillow>=10.3",
    "scikit-learn>=1.5",
    "python-docx>=1.1",
    "joblib>=1.4",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.10"]
dev = ["pytest>=8.2"]

[project.scripts]
docrouter = "docrouter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docrouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
